[package]
name = "giong-cli-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

# Its own workspace, like the other fuzz crates: needs nightly and cargo-fuzz.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "args"
path = "fuzz_targets/args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dotenv"
path = "fuzz_targets/dotenv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_parsers"
path = "fuzz_targets/host_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lint"
path = "fuzz_targets/lint.rs"
test = false
doc = false

[[bin]]
name = "record"
path = "fuzz_targets/record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dashboard_http"
path = "fuzz_targets/dashboard_http.rs"
test = false
doc = false
bench = false
