<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gióng dev</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
  --accent: #b4441f; --ok: #2f7d32; --warn: #a96b00; --bad: #c0362c; --info: #2b6cb0;
  --code: #f1f0ec; --sel: #fff4ec;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #9a9993; --line: #33322e;
    --accent: #f08a5d; --ok: #6cc070; --warn: #e0a940; --bad: #ef6b60; --info: #7fb3ef;
    --code: #2a2a26; --sel: #2d241f; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 20px;
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
.brand span { color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-weight: 600; font-size: 12px; border: 1px solid var(--line); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
.info { color: var(--info); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12px; }
.facts b { color: var(--ink); font-weight: 600; }
.builderr { flex-basis: 100%; color: var(--bad); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.builderr pre { margin: 4px 0; padding: 6px 8px; max-height: 40vh; overflow: auto; white-space: pre-wrap;
  word-break: break-word; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.builderr .fix { color: var(--muted); font-family: inherit; }
nav { display: flex; gap: 2px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px;
  color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; }
nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav .count { font-size: 11px; color: var(--muted); margin-left: 4px; }
main { padding: 16px 20px 40px; }
section { display: none; } section.on { display: block; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
input, select, textarea, button.btn { font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
textarea { font-family: ui-monospace, Menlo, monospace; font-size: 12px; width: 100%; }
button.btn { cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.btn.sel { border-color: var(--accent); color: var(--accent); }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 600; }
tr.click { cursor: pointer; } tr.click:hover, tr.picked { background: var(--sel); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono, td.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
.m { font-weight: 700; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.s2 { color: var(--ok); } .s3 { color: var(--info); } .s4 { color: var(--warn); } .s5 { color: var(--bad); }
.split { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card h3 { margin: 0 0 8px; font-size: 13px; }
pre { background: var(--code); border-radius: 6px; padding: 8px 10px; overflow: auto; max-height: 360px;
  font-size: 12px; margin: 6px 0; white-space: pre-wrap; word-break: break-all; }
.empty { color: var(--muted); padding: 24px; text-align: center; background: var(--panel);
  border: 1px dashed var(--line); border-radius: 8px; }
.empty code, .card code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
.finding { border-left: 3px solid var(--warn); }
.finding.error { border-left-color: var(--bad); }
.finding + .finding { margin-top: 10px; }
a.code { color: var(--accent); cursor: pointer; text-decoration: underline; font-family: ui-monospace, Menlo, monospace; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink);
  max-width: min(760px, 92vw); max-height: 85vh; padding: 18px 22px; }
dialog::backdrop { background: rgba(0,0,0,.35); }
.toast { position: fixed; bottom: 16px; right: 16px; background: var(--ink); color: var(--bg); padding: 8px 14px;
  border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 60vw; }
.toast.show { opacity: .95; }
th.num { text-align: right; }
@media (max-width: 640px) {
  header, nav, main { padding-left: 16px; padding-right: 16px; }
  .wide { display: none; }
  .split .card { overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Gióng <span>dev</span></div>
  <span id="status" class="pill muted">connecting</span>
  <div class="facts" id="facts"></div>
  <div class="builderr" id="builderr" hidden></div>
</header>
<nav id="tabs">
  <button data-tab="requests" class="on">Requests<span class="count" id="c-requests"></span></button>
  <button data-tab="routes">Routes<span class="count" id="c-routes"></span></button>
  <button data-tab="tasks">Workers &amp; tasks</button>
  <button data-tab="db">Pools</button>
  <button data-tab="logs">Logs<span class="count" id="c-logs"></span></button>
  <button data-tab="warnings">Warnings<span class="count" id="c-warnings"></span></button>
  <button data-tab="send">Send a request</button>
</nav>
<main>
<section id="requests" class="on">
  <div class="bar">
    <input id="rq-filter" placeholder="Filter: path, route, request id" size="34">
    <span id="rq-class"></span>
    <button class="btn" id="rq-pause">Pause</button>
    <button class="btn" id="rq-clear">Clear</button>
    <span class="muted" id="rq-note"></span>
  </div>
  <div class="split">
    <div id="rq-table"></div>
    <div id="rq-detail"></div>
  </div>
</section>
<section id="routes">
  <div class="bar">
    <button class="btn" id="rt-refresh">Refresh</button>
    <button class="btn" id="rt-openapi">Download OpenAPI</button>
    <span class="muted" id="rt-note"></span>
  </div>
  <div id="rt-table"></div>
</section>
<section id="tasks">
  <div class="bar">
    <button class="btn" id="tk-profile">Profile 1 s</button>
    <span class="muted">Live tasks by the line that spawned them; a count that keeps growing is a leak.</span>
  </div>
  <div id="tk-workers"></div><br>
  <div id="tk-table"></div><br>
  <div id="tk-profile-out"></div>
</section>
<section id="db">
  <div id="db-table"></div>
</section>
<section id="logs">
  <div class="bar">
    <input id="lg-filter" placeholder="Filter" size="34">
    <label class="muted"><input type="checkbox" id="lg-errors"> errors and warnings only</label>
  </div>
  <div id="lg-table"></div>
</section>
<section id="warnings">
  <div id="wr-list"></div>
</section>
<section id="send">
  <div class="split">
    <div class="card">
      <div class="bar">
        <select id="sd-method">
          <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option>
          <option>DELETE</option><option>HEAD</option><option>OPTIONS</option>
        </select>
        <input id="sd-path" value="/" size="40" class="mono" style="flex:1">
        <button class="btn primary" id="sd-go">Send</button>
      </div>
      <h3>Headers <span class="muted">(Name: value, one per line)</span></h3>
      <textarea id="sd-headers" rows="4" spellcheck="false">content-type: application/json</textarea>
      <h3>Body</h3>
      <textarea id="sd-body" rows="10" spellcheck="false"></textarea>
      <div class="bar"><span class="muted" id="sd-base"></span><button class="btn" id="sd-curl">Copy as curl</button></div>
    </div>
    <div id="sd-out"></div>
  </div>
</section>
</main>
<dialog id="dlg"><div id="dlg-body"></div><div class="bar" style="margin-top:12px"><button class="btn" id="dlg-close">Close</button></div></dialog>
<div class="toast" id="toast"></div>
<script>
"use strict";
// Everything from the service is shown with textContent: never as HTML.
const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : String(v));
  }
  for (const k of kids.flat(Infinity)) {
    if (k === null || k === undefined || k === false) continue;
    e.appendChild(typeof k === "object" ? k : document.createTextNode(String(k)));
  }
  return e;
}
function put(id, ...kids) { const t = $(id); t.replaceChildren(...kids.flat(Infinity).filter(Boolean)); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600); }
// This start's token: in the address giong printed (after #, so no request
// carries it in its URL), kept for reloads in this tab, then taken out of
// the address bar so a screen share or a copied link does not show it.
const TOKEN = (() => {
  const m = /^#(?:.*&)?t=([0-9a-f]{16,64})(?:&|$)/.exec(location.hash);
  if (m) {
    try { sessionStorage.setItem("giong-dashboard-token", m[1]); } catch (_) {}
    history.replaceState(null, "", location.pathname + location.search);
    return m[1];
  }
  try { return sessionStorage.getItem("giong-dashboard-token") || ""; } catch (_) { return ""; }
})();
async function api(path, body) {
  const opts = { headers: { "X-Giong-Dashboard": TOKEN } };
  if (body !== undefined) { opts.method = "POST"; opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, opts);
  let v = null;
  try { v = await r.json(); } catch (_) { v = { error: { code: "", message: "the dashboard answered " + r.status, fix: "" } }; }
  return v;
}
function errorBox(err) {
  return el("div", { class: "empty" },
    el("div", { class: "bad" }, err.message || "error"),
    err.fix ? el("div", {}, "Fix: ", err.fix) : null,
    err.code ? el("div", {}, codeLink(err.code)) : null);
}
function codeLink(code) {
  // Only giong's own codes have pages; a handler's code is shown as text.
  if (!/^GIONG-E\d{4}$/.test(code)) return el("span", { class: "mono" }, code);
  return el("a", { class: "code", onclick: () => explain(code) }, code);
}
function copy(text) { navigator.clipboard.writeText(text).then(() => toast("Copied"), () => toast("Copy failed")); }
function fmtMs(us) { return us == null ? "" : (us / 1000).toFixed(us < 10000 ? 2 : 1) + " ms"; }
function fmtBytes(n) { if (n == null) return ""; if (n < 1024) return n + " B"; if (n < 1 << 20) return (n / 1024).toFixed(1) + " KiB"; return (n / 1048576).toFixed(1) + " MiB"; }
function statusClass(s) { return s ? "s" + String(s)[0] : "muted"; }
function pretty(text, ctype) {
  if (text == null) return "";
  const t = String(text);
  if ((ctype || "").includes("json") || /^\s*[\[{]/.test(t)) { try { return JSON.stringify(JSON.parse(t), null, 2); } catch (_) {} }
  return t;
}
function shQuote(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }
// A word as it is when a shell would read it so (a method such as PURGE),
// else quoted: a recorded method comes from whatever client sent it, and
// the token rules allow | & $ and backquotes. As routes::shell_word.
function shWord(s) { s = String(s); return /^[A-Za-z0-9_-]+$/.test(s) ? s : shQuote(s); }

// ---------- tabs ----------
let tab = "requests";
for (const b of document.querySelectorAll("nav button")) {
  b.addEventListener("click", () => {
    tab = b.dataset.tab;
    for (const x of document.querySelectorAll("nav button")) x.classList.toggle("on", x === b);
    for (const s of document.querySelectorAll("main section")) s.classList.toggle("on", s.id === tab);
    if (tab === "routes" && !routesLoaded) loadRoutes();
    if (tab === "tasks") loadTasks();
    if (tab === "db") loadPools();
  });
}

// ---------- state ----------
let state = null;
async function loadState() {
  let s;
  try { s = await api("/api/state"); } catch (_) { $("status").className = "pill bad"; $("status").textContent = "dashboard stopped"; return; }
  if (s && s.error) {
    // Most often the token: this tab was opened without the printed address.
    const st = $("status");
    st.className = "pill bad";
    st.textContent = s.error.code === "GIONG-E5051" ? "open the address giong printed" : "error";
    st.title = (s.error.message || "") + (s.error.fix ? " Fix: " + s.error.fix : "");
    return;
  }
  state = s;
  const st = $("status");
  const build = s.dev && s.dev.build;
  // Why nothing serves: giong dev stops the old build when a change fails,
  // so this is never hidden behind an old build that still answers.
  const failure = s.dev && s.dev_alive !== false && s.dev.failure;
  const failWord = { build: "build failed", start: "start failed", exited: "service stopped" };
  if (build && build.state === "building") { st.className = "pill warn"; st.textContent = "building"; }
  else if (failure) { st.className = "pill bad"; st.textContent = (failWord[failure.stage] || "failed") + ": nothing serves"; }
  else if (build && build.state === "failed") { st.className = "pill bad"; st.textContent = "build failed"; }
  else if (s.overview) { st.className = "pill ok"; st.textContent = "running"; }
  else if (s.dev && s.dev_alive === false) { st.className = "pill muted"; st.textContent = "giong dev stopped"; }
  else { st.className = "pill bad"; st.textContent = "not reachable"; }
  const f = [];
  const fact = (k, v) => f.push(el("span", {}, k + " ", el("b", {}, v)));
  if (s.base_url) f.push(el("span", {}, el("a", { href: s.base_url, target: "_blank", rel: "noopener" }, s.base_url)));
  const o = s.overview;
  if (o) {
    fact("workers", o.runtime.workers);
    const tasks = o.workers.reduce((a, w) => a + (w.tasks || 0), 0); fact("tasks", tasks);
    if (o.process.rss_bytes) fact("memory", fmtBytes(o.process.rss_bytes));
    if (o.process.uptime_s != null) fact("up", Math.round(o.process.uptime_s) + " s");
    const drv = o.workers[0] && o.workers[0].driver; if (drv) fact("driver", drv);
    const busy = o.workers.filter(w => w.busy != null);
    if (busy.length) fact("busy", Math.round(100 * busy.reduce((a, w) => a + w.busy, 0) / busy.length) + "%");
  }
  if (build && build.took_ms != null) fact("last build", (build.took_ms / 1000).toFixed(1) + " s");
  if (s.dev && s.dev.restarts != null) fact("restarts", s.dev.restarts);
  put("facts", f);
  const be = $("builderr");
  if (failure && !(build && build.state === "building")) {
    be.hidden = false;
    put("builderr",
      el("div", {}, failure.code ? [codeLink(failure.code), " "] : null, el("b", {}, failure.title),
        failure.stopped_pid ? " (the previous build was stopped too: no old code answers)" : null),
      failure.detail ? el("pre", {}, failure.detail) : null,
      failure.fix ? el("div", { class: "fix" }, "Fix: ", failure.fix) : null);
  }
  else if (build && build.state === "failed" && build.error) { be.hidden = false; be.textContent = build.error + (build.errors > 1 ? "  (+" + (build.errors - 1) + " more)" : ""); }
  else be.hidden = true;
  renderWarnings();
}

// ---------- the log: requests, exchanges, logs ----------
let offset = null, paused = false;
const requests = []; // newest last
const byId = new Map();
const logs = [];
const MAX_ROWS = 2000;
let picked = null, rqClass = "all";
async function loadLog() {
  if (paused) return;
  for (let i = 0; i < 20; i++) {
    let r;
    try { r = await api("/api/log" + (offset === null ? "" : "?after=" + offset)); } catch (_) { return; }
    if (r.log === null) { $("rq-note").textContent = "No log: run the service with giong dev."; }
    if (offset !== null && r.offset < offset) { requests.length = 0; byId.clear(); logs.length = 0; }
    offset = r.offset;
    for (const e of r.entries || []) take(e);
    if (!r.more) break;
  }
  if (tab === "requests") renderRequests();
  if (tab === "logs") renderLogs();
  $("c-requests").textContent = requests.length || "";
  $("c-logs").textContent = logs.length || "";
}
function take(e) {
  if (e.kind === "request" || e.kind === "exchange") {
    const d = e.data, id = d.request_id;
    let row = id ? byId.get(id) : null;
    if (!row) {
      row = { at: e.at, ts: d.ts, method: d.method, path: d.path, query: d.query, route: d.route, status: d.status,
              duration_us: d.duration_us, worker: d.worker, request_id: id, bytes: d.bytes, peer: d.peer, cancelled: d.event === "request cancelled" };
      requests.push(row); if (id) byId.set(id, row);
      if (requests.length > MAX_ROWS) { const old = requests.shift(); if (old.request_id) byId.delete(old.request_id); }
    }
    if (e.kind === "exchange") { row.exchange = d; row.exchangeAt = e.at; if (d.query) row.query = d.query; }
    else { row.bytes = d.bytes; row.peer = d.peer; row.cancelled = d.event === "request cancelled"; if (d.error) row.error = d.error; }
  } else {
    logs.push(e);
    if (logs.length > MAX_ROWS) logs.shift();
    if (e.kind === "error" && e.data && e.data.error && e.data.request_id && byId.has(e.data.request_id)) byId.get(e.data.request_id).error = e.data.error;
  }
}
for (const c of ["all", "2xx", "3xx", "4xx", "5xx"]) {
  $("rq-class").appendChild(el("button", { class: "btn" + (c === "all" ? " sel" : ""), "data-c": c, onclick: (ev) => {
    rqClass = c; for (const b of $("rq-class").children) b.classList.toggle("sel", b === ev.target); renderRequests(); } }, c));
}
$("rq-filter").addEventListener("input", () => renderRequests());
$("rq-pause").addEventListener("click", () => { paused = !paused; $("rq-pause").textContent = paused ? "Resume" : "Pause"; if (!paused) loadLog(); });
$("rq-clear").addEventListener("click", () => { requests.length = 0; byId.clear(); picked = null; renderRequests(); put("rq-detail"); });
function renderRequests() {
  const q = $("rq-filter").value.trim().toLowerCase();
  const rows = requests.filter(r => (rqClass === "all" || String(r.status || "")[0] === rqClass[0]) &&
    (!q || [r.path, r.route, r.request_id, r.method].some(x => x && String(x).toLowerCase().includes(q)))).slice(-400).reverse();
  if (!requests.length) {
    put("rq-table", el("div", { class: "empty" }, "No requests yet. The list fills from giong-web's ",
      el("code", {}, "Logger"), " (and ", el("code", {}, "Record"), " for bodies) lines on the service's output."));
    return;
  }
  put("rq-table", el("table", {},
    el("tr", {}, el("th", { class: "wide" }, "Time"), el("th", {}, "Request"), el("th", { class: "num" }, "Status"), el("th", { class: "num" }, "Took"), el("th", { class: "num wide", title: "worker" }, "W")),
    rows.map(r => el("tr", { class: "click" + (picked === r ? " picked" : ""), onclick: () => { picked = r; renderRequests(); renderDetail(r); } },
      el("td", { class: "mono muted wide" }, (r.ts || "").slice(11, 23)),
      el("td", { class: "mono" }, el("span", { class: "m" }, r.method), " ", r.path + (r.query ? "?" + r.query : ""),
        r.exchange ? el("span", { class: "muted", title: "recorded with bodies" }, " ●") : null),
      el("td", { class: "num " + statusClass(r.status) }, r.cancelled ? "cancelled" : r.status),
      el("td", { class: "num" }, fmtMs(r.duration_us)),
      el("td", { class: "num muted wide" }, r.worker == null ? "" : r.worker)))));
}
function sideView(title, side) {
  if (!side) return null;
  const ct = (side.headers || []).find(h => h[0] === "content-type");
  let body;
  if (side.streamed) body = el("div", { class: "muted" }, "streamed: not recorded");
  else if (side.body != null) body = el("pre", {}, pretty(side.body, ct && ct[1]) || "(empty)");
  else body = el("div", { class: "muted" }, fmtBytes(side.body_len) + " of binary data");
  return el("div", {}, el("h3", {}, title),
    el("dl", { class: "kv" }, (side.headers || []).map(h => [el("dt", {}, h[0]), el("dd", {}, h[1])])),
    body, side.truncated ? el("div", { class: "warn" }, "cut at " + fmtBytes(side.body_len)) : null);
}
function curlFor(method, url, headers, body) {
  let s = "curl -i";
  if (method !== "GET") s += " -X " + shWord(method);
  for (const [k, v] of headers) if (v !== "[redacted]" && !["host", "content-length", "connection"].includes(k.toLowerCase())) s += " -H " + shQuote(k + ": " + v);
  if (body) s += " --data-binary " + shQuote(body);
  return s + " " + shQuote(url);
}
function renderDetail(r) {
  const x = r.exchange;
  const target = r.path + (r.query ? "?" + r.query : "");
  const base = (state && state.base_url) || "";
  const reqHeaders = x ? x.request.headers : [];
  const reqBody = x && x.request.body != null ? x.request.body : "";
  put("rq-detail", el("div", { class: "card" },
    el("h3", {}, el("span", { class: "m" }, r.method), " ", target, " ", el("span", { class: statusClass(r.status) }, r.status)),
    el("dl", { class: "kv" },
      el("dt", {}, "route"), el("dd", {}, r.route || "none"),
      el("dt", {}, "time taken"), el("dd", {}, fmtMs(r.duration_us)),
      el("dt", {}, "request id"), el("dd", {}, r.request_id || ""),
      el("dt", {}, "worker"), el("dd", {}, r.worker == null ? "" : r.worker),
      r.bytes != null ? [el("dt", {}, "bytes"), el("dd", {}, r.bytes)] : null,
      r.peer ? [el("dt", {}, "peer"), el("dd", {}, r.peer)] : null),
    r.error ? el("div", { class: "card finding error", style: "margin-top:8px" },
      el("div", {}, r.error.code ? codeLink(r.error.code) : null, " ", r.error.detail || ""),
      r.error.cause ? el("div", { class: "mono" }, "cause: " + r.error.cause) : null) : null,
    el("div", { class: "bar", style: "margin-top:10px" },
      el("button", { class: "btn", onclick: () => copy(curlFor(r.method, base + target, reqHeaders, reqBody)) }, "Copy as curl"),
      el("button", { class: "btn", onclick: () => openSend(r.method, target, reqHeaders, reqBody) }, "Send again"),
      x ? el("button", { class: "btn", onclick: () => saveCase(r) }, "Save as test") : null),
    x ? [sideView("Request", x.request), sideView("Response", x.response)]
      : el("p", { class: "muted" }, "Bodies are recorded when the router has giong-web's Record middleware: ",
          el("code", {}, "router.layer(Record::new(Sink::Stdout))"), ".")));
}
async function saveCase(r) {
  const name = prompt("Save as a case in tests/recorded/<name>.json. Name:", "dashboard");
  if (!name) return;
  const v = await api("/api/record/save", { at: r.exchangeAt, name });
  if (v.error) toast(v.error.message);
  else if (v.ok === false) toast((v.error && v.error.message) || "not saved");
  else toast("Saved to " + v.data.out + ". Replay: giong record replay");
}

// ---------- routes ----------
let routesLoaded = false;
async function loadRoutes() {
  routesLoaded = true;
  const r = await api("/api/routes");
  if (r.error) { put("rt-table", errorBox(r.error)); return; }
  const n = r.apps.reduce((a, x) => a + x.routes.length, 0);
  $("c-routes").textContent = n || "";
  if (!n) { put("rt-table", el("div", { class: "empty" }, "The service serves no giong-web routes.")); return; }
  put("rt-table", r.apps.map((app, i) => el("div", {},
    r.apps.length > 1 ? el("h3", {}, "Workers " + app.workers.join(", ")) : null,
    el("table", {}, el("tr", {}, el("th", {}, "Method"), el("th", {}, "Pattern"), el("th", {}, "Added at"), el("th", {}, "")),
      app.routes.map(rt => el("tr", {},
        el("td", { class: "m" }, rt.method),
        el("td", { class: "mono" }, rt.pattern, rt.stream_limit != null ? el("span", { class: "muted" }, "  streamed ≤ " + fmtBytes(rt.stream_limit)) : null),
        el("td", { class: "mono muted" }, rt.added_at),
        el("td", { class: "num" },
          el("button", { class: "btn", onclick: () => openSend(rt.method, rt.sample_path, [], ["POST", "PUT", "PATCH"].includes(rt.method) && rt.stream_limit == null ? "{}" : "") }, "Try"), " ",
          el("button", { class: "btn", onclick: () => copy(rt.curl) }, "curl"))))))));
  $("rt-note").textContent = "HEAD is answered by each GET route and OPTIONS by the router.";
}
$("rt-refresh").addEventListener("click", loadRoutes);
$("rt-openapi").addEventListener("click", async () => {
  const r = await api("/api/openapi");
  if (r.error) { toast(r.error.message); return; }
  const a = el("a", { href: URL.createObjectURL(new Blob([JSON.stringify(r, null, 2)], { type: "application/json" })), download: "openapi.json" });
  document.body.appendChild(a); a.click(); a.remove();
});

// ---------- workers, tasks, profile ----------
async function loadTasks() {
  const [t, w] = await Promise.all([api("/api/tasks"), api("/api/workers")]);
  if (w.error) put("tk-workers", errorBox(w.error));
  else put("tk-workers", el("table", {},
    el("tr", {}, ["Worker", "State", "Busy", "Polls/s", "Tasks", "Runnable", "I/O in flight", "Timers", "Blocked"].map((h, i) => el("th", { class: i === 1 || i === 8 ? "" : "num" }, h))),
    w.workers.map(x => el("tr", {},
      el("td", { class: "num" }, x.worker), el("td", {}, x.state),
      el("td", { class: "num" }, x.last_second ? Math.round(x.last_second.busy * 100) + "%" : ""),
      el("td", { class: "num" }, x.last_second ? Math.round(x.last_second.polls_per_s) : ""),
      el("td", { class: "num" }, x.tasks), el("td", { class: "num" }, x.runnable),
      el("td", { class: "num" }, x.io_in_flight == null ? "" : x.io_in_flight),
      el("td", { class: "num" }, x.timers == null ? "" : x.timers),
      el("td", { class: x.blocked ? "bad mono" : "muted" }, x.blocked ? x.blocked.for_ms + " ms in " + (x.blocked.in_task || "?") : "")))));
  if (t.error) put("tk-table", errorBox(t.error));
  else if (!t.by_location.length) put("tk-table", el("div", { class: "empty" }, "No live tasks besides the runtime's own and the connections'."));
  else put("tk-table", el("table", {},
    el("tr", {}, el("th", {}, "Spawned at"), el("th", { class: "num" }, "Tasks"), el("th", {}, "Per worker")),
    t.by_location.map(x => el("tr", {}, el("td", { class: "mono" }, x.location), el("td", { class: "num" }, x.tasks),
      el("td", { class: "mono muted" }, (x.per_worker || []).join(" "))))));
}
$("tk-profile").addEventListener("click", async () => {
  put("tk-profile-out", el("div", { class: "muted" }, "Profiling for 1 s…"));
  const p = await api("/api/profile", { duration_ms: 1000 });
  if (p.error) { put("tk-profile-out", errorBox(p.error)); return; }
  put("tk-profile-out", el("div", {}, el("h3", {}, "Where the workers spent their time (1 s)"),
    el("table", {}, el("tr", {}, ["Spawned at", "Share", "Polls", "Total", "Longest poll"].map((h, i) => el("th", { class: i ? "num" : "" }, h))),
      (p.total || []).map(x => el("tr", {}, el("td", { class: "mono" }, x.location),
        el("td", { class: "num" }, (x.share_of_all_workers * 100).toFixed(1) + "%"), el("td", { class: "num" }, x.polls),
        el("td", { class: "num" }, x.total_ms.toFixed(1) + " ms"), el("td", { class: "num" }, (x.max_us / 1000).toFixed(2) + " ms")))),
    p.note ? el("p", { class: "muted" }, p.note) : null));
});

// ---------- pools ----------
async function loadPools() {
  const s = await api("/api/sources");
  if (s.error) { put("db-table", errorBox(s.error)); return; }
  if (!s.sources.length) { put("db-table", el("div", { class: "empty" }, "No connection pools registered. giong-postgres, giong-mysql and giong-redis pools show here.")); return; }
  const keys = [...new Set(s.sources.flatMap(x => Object.keys(x.total)))];
  put("db-table", el("table", {}, el("tr", {}, el("th", {}, "Pool"), keys.map(k => el("th", { class: "num" }, k.replace(/_/g, " ")))),
    s.sources.map(x => el("tr", {}, el("td", {}, el("b", {}, x.kind), " ", el("span", { class: "mono" }, x.name)),
      keys.map(k => el("td", { class: "num" + (k.includes("wait") && x.total[k] > 0 ? " warn" : "") }, x.total[k] == null ? "" : x.total[k]))))));
}

// ---------- logs ----------
$("lg-filter").addEventListener("input", () => renderLogs());
$("lg-errors").addEventListener("change", () => renderLogs());
function renderLogs() {
  const q = $("lg-filter").value.trim().toLowerCase(), only = $("lg-errors").checked;
  const rows = logs.filter(e => {
    const text = e.kind === "text" ? e.text : JSON.stringify(e.data);
    const lvl = e.kind === "error" ? "error" : (e.data && e.data.level) || (/\b(error|panicked|warn)/i.test(text) ? "warn" : "");
    e.lvl = lvl;
    return (!only || lvl === "error" || lvl === "warn") && (!q || text.toLowerCase().includes(q));
  }).slice(-500).reverse();
  if (!logs.length) { put("lg-table", el("div", { class: "empty" }, "Nothing on the service's output besides requests.")); return; }
  put("lg-table", el("table", {}, rows.map(e => el("tr", {},
    el("td", { class: e.lvl === "error" ? "bad" : e.lvl === "warn" ? "warn" : "muted" }, e.lvl || ""),
    el("td", { class: "mono" }, e.kind === "text" ? e.text : JSON.stringify(e.data),
      e.data && e.data.error && e.data.error.code ? [" ", codeLink(e.data.error.code)] : null)))));
}

// ---------- warnings ----------
function renderWarnings() {
  const fs = (state && state.findings) || [];
  const err = state && state.service_error;
  $("c-warnings").textContent = fs.length || "";
  const items = [];
  if (err) items.push(el("div", { class: "card finding error" }, el("div", {}, codeLink(err.code), " ", err.message), el("div", { class: "muted" }, "Fix: ", err.fix)));
  for (const f of fs) items.push(el("div", { class: "card finding " + f.severity },
    el("div", {}, codeLink(f.code), " ", el("b", {}, f.title)), f.detail ? el("div", { class: "mono" }, f.detail) : null,
    f.fix ? el("div", { class: "muted" }, "Fix: ", f.fix) : null));
  put("wr-list", items.length ? items : el("div", { class: "empty" }, "No warnings from the service."));
}

// ---------- explain (offline error pages) ----------
async function explain(code) {
  const r = await api("/api/explain?code=" + encodeURIComponent(code));
  const body = $("dlg-body"); body.replaceChildren();
  if (r.error) body.appendChild(errorBox(r.error));
  else body.appendChild(markdown(r.page));
  $("dlg").showModal();
}
$("dlg-close").addEventListener("click", () => $("dlg").close());
function inline(text) {
  // `code` and [links](x) as text; nothing else.
  const out = []; const re = /`([^`]+)`|\[([^\]]+)\]\([^)]*\)/g; let last = 0, m;
  while ((m = re.exec(text))) { out.push(text.slice(last, m.index)); out.push(m[1] ? el("code", {}, m[1]) : m[2]); last = re.lastIndex; }
  out.push(text.slice(last)); return out;
}
function markdown(md) {
  const root = el("div", {}); const lines = md.split("\n"); let i = 0, list = null;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) { const code = []; i++; while (i < lines.length && !lines[i].trim().startsWith("```")) code.push(lines[i++]); i++; root.appendChild(el("pre", {}, code.join("\n"))); list = null; continue; }
    if (/^#{1,3} /.test(l)) { root.appendChild(el(l.startsWith("# ") ? "h2" : "h3", {}, inline(l.replace(/^#+ /, "")))); list = null; }
    else if (/^\s*- /.test(l)) { if (!list) { list = el("ul", {}); root.appendChild(list); } list.appendChild(el("li", {}, inline(l.replace(/^\s*- /, "")))); }
    else if (l.trim() === "") list = null;
    else if (list && /^\s+\S/.test(l)) list.lastChild.append(" ", ...inline(l.trim()));
    else root.appendChild(el("p", {}, inline(l)));
    i++;
  }
  return root;
}

// ---------- send ----------
function openSend(method, path, headers, body) {
  $("sd-method").value = method;
  $("sd-path").value = path;
  $("sd-headers").value = (headers || []).filter(h => !["host", "content-length", "connection", "user-agent", "accept-encoding"].includes(h[0]))
    .map(h => h[0] + ": " + (h[1] === "[redacted]" ? "" : h[1])).join("\n") || (body ? "content-type: application/json" : "");
  $("sd-body").value = body || "";
  document.querySelector('nav button[data-tab="send"]').click();
}
function parseHeaders() {
  return $("sd-headers").value.split("\n").map(l => l.trim()).filter(Boolean).map(l => { const i = l.indexOf(":"); return i < 0 ? [l, ""] : [l.slice(0, i).trim(), l.slice(i + 1).trim()]; });
}
$("sd-curl").addEventListener("click", () => copy(curlFor($("sd-method").value, ((state && state.base_url) || "") + $("sd-path").value, parseHeaders(), $("sd-body").value)));
$("sd-go").addEventListener("click", async () => {
  const req = { method: $("sd-method").value, path: $("sd-path").value, headers: parseHeaders(), body: $("sd-body").value };
  put("sd-out", el("div", { class: "muted" }, "Sending…"));
  const r = await api("/api/send", req);
  if (r.error) { put("sd-out", errorBox(r.error)); return; }
  const ct = (r.headers.find(h => h[0] === "content-type") || [])[1];
  put("sd-out", el("div", { class: "card" },
    el("h3", {}, el("span", { class: statusClass(r.status) }, r.status), "  ", el("span", { class: "muted" }, r.elapsed_ms.toFixed(2) + " ms, " + fmtBytes(r.body_len))),
    el("dl", { class: "kv" }, r.headers.map(h => [el("dt", {}, h[0]), el("dd", {}, h[1])])),
    r.body != null ? el("pre", {}, pretty(r.body, ct) || "(empty)") : el("div", { class: "muted" }, fmtBytes(r.body_len) + " of binary data")));
  setTimeout(loadLog, 300);
});
$("sd-path").addEventListener("keydown", (e) => { if (e.key === "Enter") $("sd-go").click(); });

// ---------- loops ----------
function every(ms, f) { const run = async () => { try { await f(); } catch (_) {} setTimeout(run, ms); }; run(); }
every(2000, loadState);
every(1000, loadLog);
every(2000, async () => { if (document.hidden) return; if (tab === "tasks") await loadTasks(); if (tab === "db") await loadPools(); });
every(10000, async () => { if (!document.hidden && routesLoaded && tab === "routes") await loadRoutes(); });
api("/api/routes").then(r => { if (r && r.apps) $("c-routes").textContent = r.apps.reduce((a, x) => a + x.routes.length, 0) || ""; }).catch(() => {});
setTimeout(() => { $("sd-base").textContent = state ? "to " + state.base_url : ""; }, 1500);
</script>
