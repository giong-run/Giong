[package]
name = "giong-postgres-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
giong-postgres = { path = ".." }

# Its own workspace, like the benchmark crates: needs nightly and cargo-fuzz.
[workspace]

[[bin]]
name = "messages"
path = "fuzz_targets/messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "url"
path = "fuzz_targets/url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scram"
path = "fuzz_targets/scram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session"
path = "fuzz_targets/session.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
