[package]
name = "giong-postgres"
version = "0.2.1"
edition = "2021"
rust-version = "1.80"
description = "A PostgreSQL client and connection pool for the giong thread-per-core runtime"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/giong-run/Giong"
documentation = "https://docs.rs/giong-postgres"
keywords = ["postgres", "postgresql", "database", "io-uring", "async"]
categories = ["database", "network-programming", "asynchronous"]

[dependencies]
giong = { path = "..", version = "0.2.1" }
giong-tls = { path = "../giong-tls", version = "0.2.1" }
# SCRAM-SHA-256 (PBKDF2, HMAC, SHA-256) and its nonce. Already compiled in
# through rustls, so it adds nothing to the build.
ring = "0.17"
# TCP keepalive and TCP_USER_TIMEOUT on the connection, to notice a server
# that vanished without closing. Already a dependency of giong.
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
libc = "0.2"
rcgen = "0.13"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
# Set by `cargo fuzz` (see fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
