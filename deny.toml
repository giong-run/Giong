# cargo-deny: the supply-chain gate for the workspace's Cargo.lock.
# Run with `cargo deny check` (scripts/preflight.sh and the CI lint job do).
#
# - advisories: no crate with a RustSec advisory (vulnerability, unsound,
#   unmaintained in the workspace's own dependencies) or a yanked version.
#   An advisory that does not apply goes into `ignore` with its ID and the
#   reason, and an issue to remove it.
# - licenses: only permissive licenses, so that giong stays usable under
#   MIT OR Apache-2.0.
# - bans: no wildcard version requirement.
# - sources: crates come from crates.io only, never a git repository or
#   another registry.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# The examples and test crates that are never published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
