version: 2
updates:
  # Every action in .github/workflows is pinned to a full commit SHA, with its
  # version in a comment, because the release job can mint a crates.io publish
  # token. This keeps the pins current: one grouped pull request a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
