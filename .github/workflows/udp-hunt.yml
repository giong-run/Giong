name: UDP rebind hunt

# Temporary: runs the UDP rebind test many times on GitHub's runners, where
# it failed three times with AddrInUse and never locally, to see what holds
# the port. Removed before the pull request merges.
on:
  pull_request:

permissions:
  contents: read

jobs:
  loop:
    name: udp loop (${{ matrix.tier }}, ${{ matrix.user }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tier: [default, no-features, coop, epoll]
        # As root, the report can name the process behind any socket.
        user: [runner, root]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build the udp test binary
        # Its path from cargo itself: newer cargo keeps test binaries
        # outside target/release/deps.
        run: |
          cargo test --release --all-features --test udp --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "udp") | .executable' \
            > "$RUNNER_TEMP/udp-bin"
          cat "$RUNNER_TEMP/udp-bin"
          test -x "$(cat "$RUNNER_TEMP/udp-bin")"
      - name: Run the udp tests 3000 times
        shell: bash
        run: |
          set +e
          bin=$(cat "$RUNNER_TEMP/udp-bin")
          case "${{ matrix.tier }}" in
            no-features) export GIONG_IO_URING_OFF=all ;;
            coop) export GIONG_IO_URING_OFF=all GIONG_RING_TIER=coop ;;
            epoll) export GIONG_DRIVER=epoll ;;
          esac
          run=()
          [ "${{ matrix.user }}" = root ] && run=(sudo -E)
          uname -r
          cat /proc/sys/net/ipv4/ip_local_port_range
          echo "udp_hash_entries $(cat /proc/sys/net/ipv4/udp_hash_entries) nproc $(nproc)"
          grep -m1 'model name' /proc/cpuinfo
          failed=0
          for i in $(seq 1 3000); do
            out=$("${run[@]}" "$bin" -q 2>&1)
            if [ $? -ne 0 ]; then
              failed=$((failed + 1))
              echo "::group::failure in run $i"
              echo "$out"
              echo "::endgroup::"
              echo "$out" | grep -A25 panicked
            fi
          done
          echo "failed $failed of 3000"
          [ "$failed" = 0 ]

  # The same binds without giong (.github/udp-hunt/repro.c): is it the
  # kernel? Several shards, to land on both kinds of runner.
  repro:
    name: repro (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run the repro
        shell: bash
        run: |
          set +e
          uname -a
          echo "udp_hash_entries $(cat /proc/sys/net/ipv4/udp_hash_entries) nproc $(nproc)"
          grep -m1 'model name' /proc/cpuinfo
          free -m | head -2
          gcc -O2 -pthread -Wall -o repro .github/udp-hunt/repro.c || exit 1
          ulimit -n 8192
          status=0
          for v in "connect=1 late_close=0" "connect=1 late_close=1" \
                   "connect=0 late_close=0" "connect=0 late_close=1"; do
            for hold in 0 1000; do
              ./repro 3000 $v noise=3 hold=$hold | tail -n 12
              [ "${PIPESTATUS[0]}" = 0 ] || status=1
            done
          done
          exit $status
