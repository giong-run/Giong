name: Release

# Runs on a tag vX.Y.Z: pushed by release-tag.yml when a release pull request is
# merged (which starts this workflow with workflow_dispatch on the tag), or
# pushed by hand. It publishes the crates to crates.io, creates the GitHub
# Release, attaches the prebuilt giong command to it and deploys giong.run.
# See docs/RELEASING.md.
#
# crates.io uses Trusted Publishing: each crate trusts this repository, this
# workflow file and the `release` environment, and the job exchanges its OIDC
# token for a short-lived publish token. No crates.io secret is stored here.
#
# Every step is idempotent: crates already on crates.io are skipped and an
# existing Release is kept, so a failed run can simply be re-run. Re-running it
# on the latest tag is also how to check that Trusted Publishing still works.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # CI's stable compiler (see ci.yml).
  RUST_STABLE: "1.100.0"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      crates: ${{ steps.version.outputs.crates }}
    steps:
      - name: Started on a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on a tag vX.Y.Z (Use workflow from: Tags), not on $GITHUB_REF_NAME"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - id: version
        name: Tag matches the crate versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Every publishable workspace member, in dependency order: a crate
          # added to [workspace] members is released with the others.
          crates=$(python3 scripts/release.py crates | tr '\n' ' ')
          for crate in $crates; do
            v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if [ "$v" != "$tag" ]; then
              echo "::error::$crate is at $v but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          echo "Crates: $crates"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
      # Versions agree, the CHANGELOG section exists, README images resolve on
      # crates.io and the site matches.
      - run: python3 scripts/release.py check
      # Trusted Publishing can only be set up for a crate that already exists on
      # crates.io, so a brand-new crate's first version is published by hand
      # (docs/RELEASING.md, "Adding a crate"). Stop here, before anything is
      # published, rather than leave a release half done.
      - name: Every crate already exists on crates.io
        env:
          CRATES: ${{ steps.version.outputs.crates }}
        run: |
          missing=""
          for crate in $CRATES; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "giong-release (github.com/giong-run/Giong)" "https://crates.io/api/v1/crates/$crate")
            [ "$code" = 200 ] || missing="$missing $crate"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not on crates.io yet:$missing. Publish their first version by hand and add the trusted publisher (docs/RELEASING.md, \"Adding a crate\"), then re-run this workflow."
            exit 1
          fi
      - run: cargo publish --workspace --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # One crate at a time, in dependency order, skipping versions already on
      # crates.io so that a failed run can simply be re-run. --no-verify: the
      # verify job already built every crate from its package without any
      # secret; building here would run every dependency's build script and
      # proc macros with the publish token in the environment.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          CRATES: ${{ needs.verify.outputs.crates }}
        run: |
          on_crates_io() {
            [ "$(curl -s -o /dev/null -w '%{http_code}' \
              -A "giong-release (github.com/giong-run/Giong)" \
              "https://crates.io/api/v1/crates/$1/$VERSION")" = 200 ]
          }
          for crate in $CRATES; do
            if on_crates_io "$crate"; then
              echo "$crate $VERSION is already on crates.io"
            else
              cargo publish --no-verify -p "$crate"
            fi
          done
          # The index can lag a little behind the upload.
          for crate in $CRATES; do
            for i in $(seq 30); do on_crates_io "$crate" && break; sleep 10; done
            on_crates_io "$crate" || { echo "::error::$crate $VERSION is not visible on crates.io"; exit 1; }
            echo "$crate $VERSION: https://crates.io/crates/$crate/$VERSION"
          done

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # GitHub's list of merged pull requests and first-time contributors,
          # configured by .github/release.yml.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md
          python3 scripts/release.py notes "$VERSION" --github-notes generated.md > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" = true ]; then
              echo "Publishing the existing draft of $GITHUB_REF_NAME with the generated notes"
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --draft=false \
                --prerelease="$PRERELEASE" --latest="$([ "$PRERELEASE" = true ] && echo false || echo true)"
            else
              echo "Release $GITHUB_REF_NAME already exists; leaving it as it is"
            fi
            exit 0
          fi
          if [ "$PRERELEASE" = true ]; then flags="--prerelease --latest=false"; else flags="--latest"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "giong $VERSION" --notes-file notes.md $flags

  # The giong command, prebuilt for each platform and attached to the Release:
  # what giong.run/install.sh and install.ps1 download. Each archive holds
  # giong-<version>-<target>/giong (giong.exe on Windows) and has a .sha256
  # and a CycloneDX SBOM (.cdx.json) next to it. Linux builds are static
  # (musl), so one binary runs on every distribution (giong is pure Rust: no C
  # toolchain needed). Re-running replaces the assets (--clobber) and attests
  # the new ones. The install scripts fall back to cargo install while an asset
  # is missing, so this job does not hold up the site.
  #
  # Provenance: each archive and the binary in it get a SLSA build provenance
  # attestation and an SBOM attestation, signed with this job's OIDC identity
  # through Sigstore and stored by GitHub, so anyone can check that a download
  # was built by this workflow from this repository at the tag:
  # `gh attestation verify <file> --repo giong-run/Giong` (docs/RELEASING.md).
  binaries:
    needs: [verify, github-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-auditable@0.7.7,cargo-cyclonedx@0.5.10
      # cargo auditable embeds the list of crates compiled in (names and
      # versions, a few hundred bytes) in the binary, so `cargo audit bin`,
      # Trivy, Grype or osv-scanner can check an installed giong for advisories.
      - name: Build giong
        run: cargo auditable build --release --locked -p giong-cli --target ${{ matrix.target }}
      - id: package
        name: Package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          # The x86_64 macOS build is cross-compiled on an arm64 runner,
          # which runs it through Rosetta when installed; skip it otherwise.
          "target/$TARGET/release/giong" version || [ "$TARGET" = x86_64-apple-darwin ]
          archive=$(scripts/package-cli.sh "$TARGET" "$VERSION" dist)
          sbom=$(scripts/sbom-cli.sh "$TARGET" "$VERSION" dist)
          cat "$archive.sha256"
          case "$TARGET" in *windows*) bin="target/$TARGET/release/giong.exe" ;; *) bin="target/$TARGET/release/giong" ;; esac
          { echo "archive=$archive"; echo "sbom=$sbom"; echo "bin=$bin"; } >> "$GITHUB_OUTPUT"
      # The archive and the binary in it, so that an installed giong can be
      # checked as well as a downloaded archive.
      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.bin }}
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.bin }}
          sbom-path: ${{ steps.package.outputs.sbom }}
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SBOM: ${{ steps.package.outputs.sbom }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" "$SBOM" \
            --clobber --repo "$GITHUB_REPOSITORY"
      # What a user runs, against the assets just uploaded.
      - name: Install with install.sh
        if: runner.os != 'Windows' && matrix.target != 'x86_64-apple-darwin'
        env:
          GIONG_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          GIONG_INSTALL="$RUNNER_TEMP/giong-bin" sh site/public/install.sh
          "$RUNNER_TEMP/giong-bin/giong" version | grep -F "giong $GIONG_VERSION"
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GIONG_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $env:GIONG_INSTALL = Join-Path $env:RUNNER_TEMP "giong-bin"
          Get-Content site/public/install.ps1 -Raw | Invoke-Expression
          $out = & (Join-Path $env:GIONG_INSTALL "giong.exe") version
          if ($out -notmatch [regex]::Escape("giong $env:GIONG_VERSION")) { throw "installed: $out" }
      # As a user checks a download: signed by this workflow, for this tag, on
      # a GitHub-hosted runner.
      - name: Verify the attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          BIN: ${{ steps.package.outputs.bin }}
        run: |
          for file in "$ARCHIVE" "$BIN"; do
            for type in https://slsa.dev/provenance/v1 https://cyclonedx.org/bom; do
              gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --predicate-type "$type" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref "refs/tags/$GITHUB_REF_NAME" --deny-self-hosted-runners
            done
          done

  site:
    needs: github-release
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Deploy giong.run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
