name: Release

# Runs on a tag vX.Y.Z: pushed by release-tag.yml when a release pull request is
# merged (which starts this workflow with workflow_dispatch on the tag), or
# pushed by hand. It publishes the three crates to crates.io, creates the GitHub
# Release and deploys giong.run. See docs/RELEASING.md.
#
# crates.io uses Trusted Publishing: each crate trusts this repository, this
# workflow file and the `release` environment, and the job exchanges its OIDC
# token for a short-lived publish token. No crates.io secret is stored here.
#
# Every step is idempotent: crates already on crates.io are skipped and an
# existing Release is kept, so a failed run can simply be re-run. Re-running it
# on the latest tag is also how to check that Trusted Publishing still works.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      crates: ${{ steps.version.outputs.crates }}
    steps:
      - name: Started on a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on a tag vX.Y.Z (Use workflow from: Tags), not on $GITHUB_REF_NAME"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - id: version
        name: Tag matches the crate versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Every publishable workspace member, in dependency order: a crate
          # added to [workspace] members is released with the others.
          crates=$(python3 scripts/release.py crates | tr '\n' ' ')
          for crate in $crates; do
            v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if [ "$v" != "$tag" ]; then
              echo "::error::$crate is at $v but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          echo "Crates: $crates"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
      # Versions agree, the CHANGELOG section exists, README images resolve on
      # crates.io and the site matches.
      - run: python3 scripts/release.py check
      # Trusted Publishing can only be set up for a crate that already exists on
      # crates.io, so a brand-new crate's first version is published by hand
      # (docs/RELEASING.md, "Adding a crate"). Stop here, before anything is
      # published, rather than leave a release half done.
      - name: Every crate already exists on crates.io
        env:
          CRATES: ${{ steps.version.outputs.crates }}
        run: |
          missing=""
          for crate in $CRATES; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "giong-release (github.com/giong-run/Giong)" "https://crates.io/api/v1/crates/$crate")
            [ "$code" = 200 ] || missing="$missing $crate"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not on crates.io yet:$missing. Publish their first version by hand and add the trusted publisher (docs/RELEASING.md, \"Adding a crate\"), then re-run this workflow."
            exit 1
          fi
      - run: cargo publish --workspace --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # One crate at a time, in dependency order, skipping versions already on
      # crates.io so that a failed run can simply be re-run. --no-verify: the
      # verify job already built every crate from its package without any
      # secret; building here would run every dependency's build script and
      # proc macros with the publish token in the environment.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          CRATES: ${{ needs.verify.outputs.crates }}
        run: |
          on_crates_io() {
            [ "$(curl -s -o /dev/null -w '%{http_code}' \
              -A "giong-release (github.com/giong-run/Giong)" \
              "https://crates.io/api/v1/crates/$1/$VERSION")" = 200 ]
          }
          for crate in $CRATES; do
            if on_crates_io "$crate"; then
              echo "$crate $VERSION is already on crates.io"
            else
              cargo publish --no-verify -p "$crate"
            fi
          done
          # The index can lag a little behind the upload.
          for crate in $CRATES; do
            for i in $(seq 30); do on_crates_io "$crate" && break; sleep 10; done
            on_crates_io "$crate" || { echo "::error::$crate $VERSION is not visible on crates.io"; exit 1; }
            echo "$crate $VERSION: https://crates.io/crates/$crate/$VERSION"
          done

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # GitHub's list of merged pull requests and first-time contributors,
          # configured by .github/release.yml.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md
          python3 scripts/release.py notes "$VERSION" --github-notes generated.md > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" = true ]; then
              echo "Publishing the existing draft of $GITHUB_REF_NAME with the generated notes"
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --draft=false \
                --prerelease="$PRERELEASE" --latest="$([ "$PRERELEASE" = true ] && echo false || echo true)"
            else
              echo "Release $GITHUB_REF_NAME already exists; leaving it as it is"
            fi
            exit 0
          fi
          if [ "$PRERELEASE" = true ]; then flags="--prerelease --latest=false"; else flags="--latest"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "giong $VERSION" --notes-file notes.md $flags

  site:
    needs: github-release
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Deploy giong.run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
