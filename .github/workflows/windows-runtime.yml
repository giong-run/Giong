name: Windows runtime

# giong itself on real Windows: the completion port driver in the runtime,
# with the parts of the test suite that are ported so far. Lives on the
# Windows branch until the port is complete and joins the main workflow.
on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/windows-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The suites that build for Windows today.
  SUITES: >-
    --lib --test executor --test channels --test time --test shutdown
    --test observe --test spin --test net --test udp --test cancel
    --test multi --test balance --test dns --test fs --test soak

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy -p giong --lib --locked -- -D warnings
      - run: cargo test -p giong --locked --no-fail-fast $SUITES
      - run: cargo test -p giong --release --locked --no-fail-fast $SUITES
      # The handle count after each of five runtime lives, for the log.
      - run: cargo test -p giong --release --locked --test soak -- --nocapture the_descriptor_count
      - run: cargo test -p giong --release --locked --test handles -- --nocapture
      # Ctrl+Break sent to a child process in its own process group.
      - run: cargo test -p giong --release --locked --test console
      # The long wake-up race tests and the other ignored ones.
      - run: cargo test -p giong --release --locked --no-fail-fast $SUITES -- --ignored
      # Cancellation and wake-up races depend on timing: one pass proves
      # little, so run the suites many times.
      - name: Repeat the tests 30 times
        run: |
          for i in $(seq 1 30); do
            # One past 15 minutes is a hang; its log names the test.
            timeout 900 cargo test -p giong --release --locked -q $SUITES > run.log 2>&1 || { echo "run $i failed (exit $?, 124 is a hang)"; cat run.log; exit 1; }
          done
          echo "30 runs passed" >> "$GITHUB_STEP_SUMMARY"

  msrv:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.80"
      - run: cargo check -p giong --locked
