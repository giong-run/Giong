name: gRPC

# giong-grpc against grpc-go, both directions, with the test cases of gRPC's
# interoperability specification, and grpcurl through reflection
# (giong-grpc/interop/run.sh). The crate's own tests, clippy, docs and MSRV
# run in CI with the rest of the workspace.

on:
  # A draft skips these jobs (they are not required checks); marking it ready
  # for review runs them.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "giong-grpc/**"
      - "giong-grpc-build/**"
      - "giong-proto/**"
      - "giong-http/**"
      - "src/**"
      - ".github/workflows/grpc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grpc-${{ github.ref }}
  cancel-in-progress: true

env:
  # The stable compiler of every job that does not name one (MSRV, nightly and
  # instr name their own). Pinned, not `stable`, so that a new Rust release
  # (new lints, a new target/ layout) cannot turn main red overnight and so that
  # scripts/preflight.sh runs the same compiler locally. Raise it in a pull
  # request of its own when a Rust release comes out.
  RUST_STABLE: "1.100.0"
  CARGO_TERM_COLOR: always
  GRPC_GO: v1.75.1
  GRPCURL: v1.9.3

jobs:
  interop:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      # The runner image ships Go; the script needs 1.24 or later.
      - run: go version
      # grpc-go's interop programs and grpcurl change only with their tags.
      - name: Restore the grpc-go programs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/grpc-interop/bin
          key: grpc-interop-${{ env.GRPC_GO }}-${{ env.GRPCURL }}-ubuntu-24.04
      - name: Run the interoperability cases
        run: giong-grpc/interop/run.sh
