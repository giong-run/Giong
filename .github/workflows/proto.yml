name: Proto

# giong-proto and giong-grpc-build (prototypes for 1.1): Google's protobuf
# conformance suite and the differential tests against prost. The crates'
# own tests, clippy, docs and MSRV run in CI with the rest of the workspace.

on:
  # A draft skips these jobs (they are not required checks); marking it ready
  # for review runs them.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "giong-proto/**"
      - "giong-grpc-build/**"
      - ".github/workflows/proto.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proto-${{ github.ref }}
  cancel-in-progress: true

env:
  # The stable compiler of every job that does not name one (MSRV, nightly and
  # instr name their own). Pinned, not `stable`, so that a new Rust release
  # (new lints, a new target/ layout) cannot turn main red overnight and so that
  # scripts/preflight.sh runs the same compiler locally. Raise it in a pull
  # request of its own when a Rust release comes out.
  RUST_STABLE: "1.100.0"
  CARGO_TERM_COLOR: always
  PROTOBUF_TAG: v36.2

jobs:
  conformance:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      # Building the runner takes about 10 minutes; it changes only with the tag.
      # The runner loads the jsoncpp library that the build fetches and builds
      # beside it, so the cache holds both.
      - name: Restore the conformance runner
        id: runner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            giong-proto/conformance/target/protobuf/build/conformance_test_runner
            giong-proto/conformance/target/protobuf/build/**/libjsoncpp.so*
          key: protobuf-conformance-runner-${{ env.PROTOBUF_TAG }}-ubuntu-24.04-2
      - name: Install build tools
        if: steps.runner.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: Run the conformance suite
        run: giong-proto/conformance/run.sh

  differential:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: Differential tests against prost, message structs
        working-directory: giong-proto/conformance
        env:
          GIONG_DIFF_CASES: "1000000"
        run: cargo test --release
