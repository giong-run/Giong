# Temporary: where the CPU goes in the pingpong and oneshot benches on macOS.
name: macOS bench profile
on:
  push:
    branches: ["bench/macos-*"]
permissions:
  contents: read
jobs:
  prof:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Profile
        run: |
          cd bench/core
          CARGO_PROFILE_RELEASE_DEBUG=line-tables-only cargo build --release --quiet
          B=target/release/bench-core
          for w in pingpong oneshot yield; do
            for r in giong tokio-ct; do
              echo "== $r $w"; $B $r $w
              /usr/bin/time -l $B $r $w 2>&1 | grep -E "real|instructions|cycles|context switches|page" || true
            done
          done
          for r in giong tokio-ct; do
            $B $r pingpong >/dev/null & pid=$!
            sleep 0.3
            sample $pid 3 -file /tmp/$r.txt >/dev/null 2>&1 || true
            wait $pid || true
            echo "== sample $r pingpong (heaviest stack)"
            sed -n '/Sort by top of stack/,/^$/p' /tmp/$r.txt | head -40
            echo "== call graph $r (top)"
            sed -n '/Call graph:/,/Total number in stack/p' /tmp/$r.txt | head -80
          done
