name: Fuzz

# Coverage-guided fuzzing with cargo-fuzz (libFuzzer) of everything that reads
# bytes from the network: giong-http's server (HTTP/1.1, HTTP/2 and HPACK) and
# client, giong-web's router and request handling, and the PostgreSQL, MySQL
# and Redis protocol readers. Every night each target runs for 10 minutes
# and its corpus is kept in the Actions cache, so the corpus keeps growing; pull
# requests that touch these crates get a short run of each target. A crash fails
# the job and uploads the input that caused it.

on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "giong-http/**"
      - "giong-postgres/**"
      - "giong-mysql/**"
      - "giong-redis/**"
      - "giong-web/**"
      - "src/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: giong-http, target: head }
          - { crate: giong-http, target: chunked }
          - { crate: giong-http, target: connection }
          - { crate: giong-http, target: response_head }
          - { crate: giong-http, target: url }
          - { crate: giong-http, target: inflate }
          - { crate: giong-http, target: hpack }
          - { crate: giong-http, target: h2 }
          - { crate: giong-http, target: h2_client }
          - { crate: giong-postgres, target: messages }
          - { crate: giong-postgres, target: scram }
          - { crate: giong-postgres, target: url }
          - { crate: giong-postgres, target: session }
          - { crate: giong-mysql, target: payload }
          - { crate: giong-mysql, target: framing }
          - { crate: giong-mysql, target: rows }
          - { crate: giong-mysql, target: url }
          - { crate: giong-redis, target: replies }
          - { crate: giong-redis, target: url }
          - { crate: giong-web, target: routes }
          - { crate: giong-web, target: request }
    name: fuzz (${{ matrix.crate }} ${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # The prebuilt cargo-fuzz is a musl binary and builds for its own target by
      # default, where the sanitizers cannot link: every cargo fuzz command
      # below names the glibc target.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-
      - name: Fuzz
        working-directory: ${{ matrix.crate }}
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '600' }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=10 -rss_limit_mb=4096 -print_final_stats=1
      - name: Shrink the corpus
        if: success() && github.event_name != 'pull_request'
        working-directory: ${{ matrix.crate }}
        run: |
          cargo fuzz cmin --target x86_64-unknown-linux-gnu ${{ matrix.target }} fuzz/corpus/${{ matrix.target }}
      - name: Save the corpus
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.crate }}-${{ matrix.target }}
          path: ${{ matrix.crate }}/fuzz/artifacts/${{ matrix.target }}
