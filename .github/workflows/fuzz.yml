name: Fuzz

# Coverage-guided fuzzing of giong-http with cargo-fuzz (libFuzzer). Every night
# each target runs for 10 minutes and its corpus is kept in the Actions cache,
# so the corpus keeps growing; pull requests that touch giong-http get a short
# run of each target. A crash fails the job and uploads the input that caused it.

on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "giong-http/**"
      - "src/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [head, chunked, connection]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: giong-http/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        working-directory: giong-http
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '600' }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=10 -rss_limit_mb=4096 -print_final_stats=1
      - name: Shrink the corpus
        if: success() && github.event_name != 'pull_request'
        working-directory: giong-http
        run: |
          cargo fuzz cmin ${{ matrix.target }} fuzz/corpus/${{ matrix.target }}
      - name: Save the corpus
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: giong-http/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: giong-http/fuzz/artifacts/${{ matrix.target }}
