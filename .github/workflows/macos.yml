# The macOS prototype (1.2): the kqueue driver and the portability layer,
# tested on Apple Silicon runners. This workflow lives on the prototype
# branch only; nothing of it lands on main before 1.0.0.
#
# Every test binary runs on its own under a time limit (.github/macos-tests.sh),
# so one run shows the whole picture: passed, failed, ignored and hung tests
# per binary go to the job summary and, as notices, to the run's annotations.

name: macOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      GIONG_TEST_EXPECT_DRIVER: kqueue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - run: sw_vers && uname -a && sysctl -n hw.ncpu
      - name: Clippy (every crate, every target)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build the tests
        run: cargo test --workspace --all-features --no-run
      - name: Tests, binary by binary
        # Each test binary runs under a time limit; one that runs out of
        # time is run again test by test, so a hung test is named. Doc tests
        # are not run here.
        run: .github/macos-tests.sh "${{ matrix.os }}"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-${{ matrix.os }}
          path: logs/
