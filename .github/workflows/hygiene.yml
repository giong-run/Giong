name: Hygiene

# Every Monday: the branches with no open pull request and the open pull requests
# nobody has touched for a week, in the issue labelled `hygiene` (scripts/hygiene.py,
# docs/DEVELOPMENT.md, "Leave nothing behind"). It reads branches and pull requests
# and writes that one issue; it never deletes a branch or closes a pull request.

on:
  schedule:
    - cron: "17 1 * * 1"   # Monday 01:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      issues: write   # the `hygiene` issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/hygiene.py --issue
