name: Hygiene

# Every Monday, and on demand: delete the branches whose commits are kept elsewhere
# (the head of a closed or merged pull request, or already in main), then put the
# branches with no open pull request, the open pull requests nobody has touched for a
# week and the issues nobody has touched for two into the issue labelled `hygiene`
# (scripts/hygiene.py, docs/DEVELOPMENT.md, "Leave nothing behind"). It never deletes
# main, release/*, a branch an open pull request uses, or one listed in
# .github/hygiene-keep.txt, and it never closes a pull request. Agents start it through
# the workflow_dispatch API after closing pull requests.

on:
  schedule:
    - cron: "17 1 * * 1"   # Monday 01:17 UTC
  workflow_dispatch:
    inputs:
      prune:
        description: "Delete the branches whose commits are kept elsewhere"
        type: boolean
        default: true
      dry_run:
        description: "List what would be deleted, delete nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hygiene
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # delete branches (git refs API)
      pull-requests: read
      issues: write     # the `hygiene` issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env:
          GH_TOKEN: ${{ github.token }}
          PRUNE: ${{ github.event_name == 'schedule' || inputs.prune }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--issue)
          [ "$PRUNE" = true ] && args+=(--prune)
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          python3 scripts/hygiene.py "${args[@]}"
