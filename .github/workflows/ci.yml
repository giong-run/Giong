name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release pull request is opened by GitHub Actions, which starts no
  # pull_request run; prepare-release.yml starts CI on its branch this way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # Crate versions agree, README images use absolute URLs that resolve on
      # crates.io, CHANGELOG.md is well formed and site/public is up to date.
      - run: python3 scripts/release.py check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80.0
      # Libraries only: the tests generate certificates with rcgen, whose
      # dependencies need a newer compiler.
      - run: cargo check --workspace --all-features

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: uname -r
      - run: scripts/check.sh test

  # The io_uring setup tiers used by kernels older than 6.1, forced on the
  # runner's newer kernel with GIONG_RING_TIER.
  fallback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check.sh fallback

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      # ThreadSanitizer cannot map its shadow memory with the runner's default
      # address-space randomisation.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: ROUNDS=2 scripts/check.sh tsan

  # Model-check the wake-up handshakes in src/notify.rs with loom, then run the
  # same race on the runner's real CPUs.
  loom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check.sh loom
