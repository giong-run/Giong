name: CI

on:
  pull_request:
  # A pull request in the merge queue: the same jobs, on main with the pull
  # request and those queued before it merged, before main moves.
  merge_group:
  # The release pull request is opened by GitHub Actions, which starts no
  # pull_request run; prepare-release.yml starts CI on its branch this way.
  workflow_dispatch:
  # A push to main: main.yml runs these jobs for a commit that no run in the
  # merge queue has tested.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run of the push before it. A run
# on main is never cancelled (each has a group of its own): in a cancelled run
# `fallback` and `tsan` report a failure, as they must on a pull request, where
# a skipped required check would count as passed, and main would look broken
# when it is not.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # giong-postgres's tests start a throwaway PostgreSQL server from the
  # binaries the runner image ships (/usr/lib/postgresql/16/bin). Without
  # this they would skip, quietly, if the binaries went missing.
  GIONG_PG_REQUIRED: "1"
  # The same for giong-mysql and the runner's MySQL 8.0 (/usr/sbin/mysqld,
  # whose service is left stopped).
  GIONG_MYSQL_REQUIRED: "1"
  # And for giong-redis, whose redis-server the jobs below install.
  GIONG_REDIS_REQUIRED: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # Crate versions agree, README images use absolute URLs that resolve on
      # crates.io, CHANGELOG.md is well formed and the site builds without a broken link.
      - run: python3 scripts/release.py check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.80.0
      # Libraries only: the tests generate certificates with rcgen, whose
      # dependencies need a newer compiler.
      - run: cargo check --workspace --all-features

  # The release build of every test binary, once for the whole run: fat LTO
  # makes it the slowest step by far, and the jobs `test`, `fallback`, `docker`
  # and `kernels` all run these binaries. They take this job's target/release
  # and then run the same cargo commands as before, which find it up to date
  # (scripts/shared-build.sh says how, and what makes that safe).
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: scripts/shared-build.sh pack "$RUNNER_TEMP/release-build.tar.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build.tar.zst
          if-no-files-found: error
          # Packed with zstd already.
          compression-level: 0
          retention-days: 1
          # A run started again uploads it again.
          overwrite: true

  test:
    needs: build
    # A required check that is skipped counts as passed, and a job is skipped
    # when one it needs fails: this one always runs, and fails by itself.
    if: always()
    runs-on: ubuntu-24.04
    env:
      # giong must choose io_uring by itself on the runner: if a runner kernel
      # ever refuses it, the run fails instead of quietly testing epoll only.
      GIONG_TEST_EXPECT_DRIVER: io_uring
      # The kernel TLS tests fail instead of skipping without the module.
      GIONG_KTLS_REQUIRED: 1
      # giong-postgres's tests through PgBouncer fail instead of skipping
      # without it.
      GIONG_PGBOUNCER_REQUIRED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: The build must have succeeded
        run: test "${{ needs.build.result }}" = success
      - run: uname -r
      # The release build of the `build` job. If it cannot be had (it is kept
      # for a day, so a job run again later finds none), this job builds the
      # test binaries itself, as scripts/shared-build.sh says in a warning.
      - name: Fetch the release build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: release-build
          path: ${{ runner.temp }}
      - run: scripts/shared-build.sh unpack "$RUNNER_TEMP/release-build.tar.zst"
      - name: Install redis-server and pgbouncer
        # Ubuntu's Redis 7.0 and PgBouncer 1.22. The tests start their own
        # servers; the services apt starts are stopped.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q redis-server pgbouncer
          sudo systemctl stop redis-server pgbouncer
      - name: Load the kernel's tls module, so the kernel TLS tests run
        run: sudo modprobe tls || { sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe tls; }
      # Linux 6.14 to 7.2 count every io_uring ring against the
      # locked-memory limit, summed over the runner user's processes, and
      # tests run runtimes side by side: lift the limit, so that each of them
      # gets io_uring (docs/DEPLOYMENT.md, "Locked-memory limit"). tests/
      # blocked.rs checks what happens under a low one.
      - run: ulimit -l && sudo prlimit --pid $$ --memlock=unlimited:unlimited && ulimit -l && scripts/check.sh test

  # HTTP/2 conformance: h2spec against giong-http's h2 example, over TLS
  # (HTTP/2 chosen through ALPN) with the strict cases too, and over plain TCP
  # with prior knowledge. On the plain port a connection that does not start
  # with the HTTP/2 preface is an HTTP/1.1 one, so the case that sends a broken
  # preface (3.5/2) runs over TLS only. h2spec is built from source at a pinned
  # commit (the Go checksum database checks the download).
  h2spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - run: go install github.com/summerwind/h2spec/cmd/h2spec@v1.5.1-0.20220625142712-af83a65f0b62
      - run: cargo build --release -p giong-http --features tls --example h2
      - name: Run h2spec
        run: |
          GIONG_WORKERS=2 target/release/examples/h2 127.0.0.1:8443 127.0.0.1:8080 &
          for _ in $(seq 100); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.1; done
          h2spec=$(go env GOPATH)/bin/h2spec
          "$h2spec" --strict --tls --insecure --port 8443 --timeout 5
          "$h2spec" --strict --port 8080 --timeout 5 \
            generic hpack http2/3.5/1 http2/4 http2/5 http2/6 http2/7 http2/8

  # The database crates against the other server versions they support; the
  # jobs above use the runner's PostgreSQL 16, MySQL 8.0 and Ubuntu's Redis
  # 7.0. Each entry installs one server and runs one crate's tests on it.
  servers:
    name: servers (${{ matrix.server }})
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    # These take a few minutes. A server that does not start, or a test that
    # waits for one for ever, must not hold a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: postgres 14, crate: giong-postgres, postgres: "14" }
          - { server: postgres 15, crate: giong-postgres, postgres: "15" }
          - { server: postgres 17, crate: giong-postgres, postgres: "17" }
          - { server: postgres 18, crate: giong-postgres, postgres: "18" }
          # `sha256` is the archive's hash, checked before it is unpacked:
          # TLS protects the download, the hash protects against a changed
          # archive on the server. Redis's come from github.com/redis/redis-hashes.
          - { server: mysql 8.4, crate: giong-mysql, mysql: "8.4.3", sha256: b614e51fddac1bbec1dd9cf0a96fcf2426007a8dbbbc3f6b17c555e3b92b017e }
          - { server: mysql 9.1, crate: giong-mysql, mysql: "9.1.0", sha256: 8d853ff095a72cb263e22dcca2b3ce6e3bd49cb2e05b89aeddb0bab626f4b102 }
          # MariaDB comes from its apt repository, whose packages apt checks
          # against MariaDB's signing key; the key is checked by fingerprint.
          # The repository has 10.6 for Ubuntu 22.04 and older only.
          - { server: mariadb 10.6, crate: giong-mysql, mariadb: "10.6", os: ubuntu-22.04 }
          - { server: mariadb 10.11, crate: giong-mysql, mariadb: "10.11" }
          - { server: mariadb 11.4, crate: giong-mysql, mariadb: "11.4" }
          - { server: mariadb 11.8, crate: giong-mysql, mariadb: "11.8" }
          - { server: redis 6.2, crate: giong-redis, redis: "6.2.16", sha256: 846bff83c26d827d49f8cc8114ea9d1e72eea1169f7de36b8135ea2cec104e7d }
          - { server: redis 7.4, crate: giong-redis, redis: "7.4.1", sha256: bc34b878eb89421bbfca6fa78752343bf37af312a09eb0fae47c9575977dfaa2 }
          - { server: valkey 8.0, crate: giong-redis, valkey: "8.0.1", sha256: 1e1d6dfbed2f932a87afbc7402be050a73974a9b19a9116897e537a6638e5e1d }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install PostgreSQL ${{ matrix.postgres }}
        if: matrix.postgres
        # From the PostgreSQL project's apt repository; the cluster apt
        # creates is stopped, the tests start their own.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-${{ matrix.postgres }}
          sudo systemctl stop postgresql
          echo "GIONG_PG_BIN=/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_ENV"
      - name: Install MySQL ${{ matrix.mysql }}
        if: matrix.mysql
        # Oracle's generic Linux build, the minimal one (no debug binaries or
        # test suite, about 60 MB), which Oracle makes for glibc 2.17 only.
        # mysqld links libaio.so.1, which Ubuntu 24.04 renamed libaio.so.1t64.
        # The mysql client, which the tests use to set the server up, links
        # ncurses 5, which Ubuntu dropped in 24.04: it comes from Ubuntu
        # 22.04, checked against the hashes in that release's package index.
        run: |
          v=${{ matrix.mysql }}
          name=mysql-$v-linux-glibc2.17-x86_64-minimal
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$name.tar.xz" "https://cdn.mysql.com/archives/mysql-${v%.*}/$name.tar.xz"
          echo "${{ matrix.sha256 }}  $name.tar.xz" | sha256sum -c -
          tar -xJf "$name.tar.xz"
          pool=http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses
          curl -fsSL --retry 3 -O "$pool/libtinfo5_6.3-2_amd64.deb" -O "$pool/libncurses5_6.3-2_amd64.deb"
          printf '%s\n' \
            "d2597b5aec92a930cf549e1b429ad892595813e72ec7814685ea146a9fb715e5  libtinfo5_6.3-2_amd64.deb" \
            "d9b8efb37a056e01c46d93c7ef6977aa04ad2586978137d9a3954c15ad5d14c3  libncurses5_6.3-2_amd64.deb" \
            | sha256sum -c -
          sudo apt-get update -q
          sudo apt-get install -y -q libaio1t64 libnuma1 ./libtinfo5_6.3-2_amd64.deb ./libncurses5_6.3-2_amd64.deb
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          "$RUNNER_TEMP/$name/bin/mysqld" --version
          "$RUNNER_TEMP/$name/bin/mysql" --version
          echo "GIONG_MYSQL_BIN=$RUNNER_TEMP/$name/bin" >> "$GITHUB_ENV"
      - name: Install MariaDB ${{ matrix.mariadb }}
        if: matrix.mariadb
        # MariaDB's own packages for this Ubuntu, from its apt repository
        # (apt checks them against MariaDB's signing key, and the key is
        # checked against its fingerprint), unpacked into a directory rather
        # than installed over the runner's MySQL; what they need from Ubuntu
        # is installed. Ubuntu has MariaDB packages of its own under the same
        # names, so each is taken at the version MariaDB's repository has,
        # and the server's version is checked.
        env:
          MARIADB: ${{ matrix.mariadb }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mariadb-keyring.pgp" \
            https://mariadb.org/mariadb_release_signing_key.pgp
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/mariadb-keyring.pgp" \
            | awk -F: '$1 == "fpr" && !seen++ { print $10 }')
          if [ "$fingerprint" != 177F4010FE56CA3336300305F1656F24C74CD1D8 ]; then
            echo "MariaDB's signing key has the fingerprint $fingerprint, not the one expected"
            exit 1
          fi
          sudo install -D -m 644 "$RUNNER_TEMP/mariadb-keyring.pgp" /etc/apt/keyrings/mariadb-keyring.pgp
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [signed-by=/etc/apt/keyrings/mariadb-keyring.pgp] https://deb.mariadb.org/$MARIADB/ubuntu $codename main" \
            | sudo tee /etc/apt/sources.list.d/mariadb.list
          sudo apt-get update -q
          mkdir -p "$RUNNER_TEMP/mariadb-debs" && cd "$RUNNER_TEMP/mariadb-debs"
          pkgs=()
          for base in mariadb-server-core mariadb-server mariadb-client-core mariadb-client \
            mariadb-common libmariadb3; do
            # Older series name some packages with the version (mariadb-server-10.6).
            for p in "$base" "$base-$MARIADB"; do
              v=$(apt-cache madison "$p" 2>/dev/null | awk -F'|' '$2 ~ /maria/ && !seen++ { gsub(/ /, "", $2); print $2 }')
              if [ -n "$v" ]; then pkgs+=("$p=$v"); fi
            done
          done
          echo "${pkgs[@]}"
          apt-get download "${pkgs[@]}"
          root="$RUNNER_TEMP/mariadb"
          for deb in *.deb; do dpkg -x "$deb" "$root"; done
          deps=$(for deb in *.deb; do dpkg-deb -f "$deb" Depends; done \
            | tr ',' '\n' | sed -e 's/([^)]*)//g' -e 's/|.*//' -e 's/:any//' -e 's/ //g' \
            | grep -v -E '^(mariadb|mysql|libmariadb|galera|default-mysql|debconf|adduser|passwd|lsb-base|init-system|perl|libdbi|libdbd|psmisc|rsync|procps|iproute2|socat|sed|\$)' \
            | sort -u)
          sudo apt-get install -y -q --no-install-recommends $deps
          export LD_LIBRARY_PATH="$root/usr/lib/x86_64-linux-gnu"
          if ldd "$root"/usr/sbin/mariadbd "$root"/usr/bin/mariadb | grep 'not found'; then exit 1; fi
          "$root/usr/sbin/mariadbd" --version | tee /dev/stderr | grep -E -q "Ver $MARIADB\.[0-9]+-MariaDB"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "GIONG_MYSQL_BIN=$root/usr/sbin" >> "$GITHUB_ENV"
      - name: Build Redis ${{ matrix.redis }}
        if: matrix.redis
        # From source, with TLS, which the tests use.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libssl-dev
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/redis.tar.gz" \
            "https://download.redis.io/releases/redis-${{ matrix.redis }}.tar.gz"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/redis.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/redis.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/redis-${{ matrix.redis }}" -j4 BUILD_TLS=yes > /dev/null
          echo "GIONG_REDIS_BIN=$RUNNER_TEMP/redis-${{ matrix.redis }}/src" >> "$GITHUB_ENV"
      - name: Build Valkey ${{ matrix.valkey }}
        if: matrix.valkey
        # Valkey answers to redis-server's name only once installed; the
        # tests look for that name.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libssl-dev
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/valkey.tar.gz" \
            "https://github.com/valkey-io/valkey/archive/refs/tags/${{ matrix.valkey }}.tar.gz"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/valkey.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/valkey.tar.gz" -C "$RUNNER_TEMP"
          src="$RUNNER_TEMP/valkey-${{ matrix.valkey }}/src"
          make -C "$src/.." -j4 BUILD_TLS=yes > /dev/null
          ln -sf valkey-server "$src/redis-server"
          echo "GIONG_REDIS_BIN=$src" >> "$GITHUB_ENV"
      # The locked-memory limit is lifted as in the test job.
      - run: sudo prlimit --pid $$ --memlock=unlimited:unlimited && cargo test -p ${{ matrix.crate }} --all-features

  # The io_uring of older kernels, forced on the runner's newer one: without
  # the optional io_uring features (GIONG_IO_URING_OFF), then also on the
  # setup tiers of kernels older than 6.1 (GIONG_RING_TIER); and the epoll
  # driver (GIONG_DRIVER=epoll). What `scripts/check.sh fallback` runs one
  # after the other, as four jobs side by side.
  fallback-tiers:
    name: fallback (${{ matrix.tier }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tier: [no-features, coop, basic, epoll]
    env:
      GIONG_TEST_EXPECT_DRIVER: io_uring
      GIONG_KTLS_REQUIRED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # The release build of the `build` job. If it cannot be had (it is kept
      # for a day, so a job run again later finds none), this job builds the
      # test binaries itself, as scripts/shared-build.sh says in a warning.
      - name: Fetch the release build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: release-build
          path: ${{ runner.temp }}
      - run: scripts/shared-build.sh unpack "$RUNNER_TEMP/release-build.tar.zst"
      - name: Install redis-server
        # Ubuntu's Redis 7.0. The tests start their own server; the
        # service apt starts is stopped.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q redis-server
          sudo systemctl stop redis-server
      - name: Load the kernel's tls module, so the kernel TLS tests run
        run: sudo modprobe tls || { sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe tls; }
      # The locked-memory limit is lifted as in the test job.
      - run: sudo prlimit --pid $$ --memlock=unlimited:unlimited && scripts/check.sh fallback ${{ matrix.tier }}

  # The required check: every tier above passed. It always runs, because a
  # skipped required check counts as passed.
  fallback:
    needs: fallback-tiers
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.fallback-tiers.result }}" = success

  # The epoll driver where it is needed: a container with Docker's default
  # seccomp profile, which blocks io_uring. Nothing names a driver, so the
  # tests also show that giong falls back to epoll by itself. The database
  # crates' tests skip here (no servers in the image).
  docker:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # The release build of the `build` job. If it cannot be had (it is kept
      # for a day, so a job run again later finds none), this job builds the
      # test binaries itself, as scripts/shared-build.sh says in a warning.
      - name: Fetch the release build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: release-build
          path: ${{ runner.temp }}
      - run: scripts/shared-build.sh unpack "$RUNNER_TEMP/release-build.tar.zst"
      - name: List the test binaries
        run: |
          mkdir -p target
          cargo test --release --workspace --all-features --no-run --message-format=json |
            python3 -c '
          import json, sys
          for line in sys.stdin:
              msg = json.loads(line)
              if msg.get("reason") == "compiler-artifact" and msg.get("executable") and msg["profile"]["test"]:
                  print(msg["executable"])
          ' > target/test-binaries.txt
          wc -l target/test-binaries.txt
      # A container cannot load kernel modules, but uses the host's: kernel
      # TLS on the epoll driver, inside the container.
      - name: Load the kernel's tls module, so the kernel TLS tests run
        run: sudo modprobe tls || { sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe tls; }
      - name: Run them in a container with the default seccomp profile
        run: |
          docker info --format '{{.SecurityOptions}}' | grep -q seccomp
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -v /etc/ssl/certs:/etc/ssl/certs:ro \
            -e GIONG_TEST_EXPECT_DRIVER=epoll -e GIONG_KTLS_REQUIRED=1 ubuntu:24.04 sh -ec '
              for t in $(cat target/test-binaries.txt); do
                echo "== $t"
                "$t" -q
              done'

  # ThreadSanitizer over every test: twice on io_uring and once on the epoll
  # driver, which hands file operations to threads of its own. Three jobs side
  # by side, each with its own build (the standard library included).
  tsan-runs:
    name: tsan (${{ matrix.driver }}, run ${{ matrix.run }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: io_uring, run: 1 }
          - { driver: io_uring, run: 2 }
          - { driver: epoll, run: 1 }
    env:
      GIONG_TEST_EXPECT_DRIVER: io_uring
      GIONG_KTLS_REQUIRED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rust-src
      # ThreadSanitizer cannot map its shadow memory with the runner's default
      # address-space randomisation.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Install redis-server
        # Ubuntu's Redis 7.0. The tests start their own server; the
        # service apt starts is stopped.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q redis-server
          sudo systemctl stop redis-server
      - name: Load the kernel's tls module, so the kernel TLS tests run
        run: sudo modprobe tls || { sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe tls; }
      # The locked-memory limit is lifted as in the test job.
      - name: ThreadSanitizer on ${{ matrix.driver }}
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          if [ "${{ matrix.driver }}" = epoll ]; then export GIONG_DRIVER=epoll; fi
          ROUNDS=1 scripts/check.sh tsan

  # The required check: every ThreadSanitizer job above passed.
  tsan:
    needs: tsan-runs
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.tsan-runs.result }}" = success

  # The unsafe code under Miri, which checks every access against Rust's
  # memory and aliasing rules: the unit tests and the tests it can run, on the
  # epoll driver (scripts/check.sh says which).
  miri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri, rust-src
      - run: scripts/check.sh miri

  # Model-check the wake-up handshakes in src/notify.rs with loom, then run the
  # same race on the runner's real CPUs.
  loom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: scripts/check.sh loom

  # The deterministic simulation (sim/README.md): the epoll driver on a
  # simulated kernel, with faults chosen by a seed; scenarios for HTTP, TLS,
  # HTTP/2, Redis, PostgreSQL and files, months of simulated uptime, and the
  # core crate's tests with and without faults. A failure prints its seed.
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: scripts/check.sh sim

  # The core crate's tests with each of its direct dependencies at the lowest
  # version its Cargo.toml allows, so that the floors there are checked, not
  # assumed: io-uring 0.7.0 to 0.7.14 once hung a busy worker's I/O, which a
  # fresh lockfile (with the newest versions) never shows. Only the core crate
  # for now; the other crates' floors are not all consistent yet, and a crate
  # joins `members` here once they are.
  minimal-versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Resolve the direct dependencies to their lowest versions
        run: |
          sed -i 's/^members = \[.*\]$/members = ["."]/' Cargo.toml
          grep -q '^members = \["."\]$' Cargo.toml
          cargo +nightly update -Z direct-minimal-versions
          cargo tree -p giong --depth 1 -e normal
      # The locked-memory limit is lifted as in the test job.
      - run: sudo prlimit --pid $$ --memlock=unlimited:unlimited && cargo test --release -p giong --all-features

  # The whole suite on real 6.0 and 6.1 kernels, each booted in QEMU (KVM),
  # on 5.15, whose io_uring lacks buffer rings: giong runs on epoll there, and
  # on the kernel Ubuntu 24.04 ships, whose buffer-ring bug (6.8.0-135 and
  # later) giong works around to stay on io_uring. Each run checks the driver
  # giong chose by itself and the kernel bugs it had to work around.
  kernels:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ktls: the guest loads the tls module and the kernel TLS tests
          # must run (5.15 on epoll, 6.1 and 6.8 without key updates, 6.18
          # with them). 6.0 is left out: giong-tls refuses its kernel TLS,
          # which can crash the kernel when a connection closes. features:
          # the optional io_uring features giong must find. soak: seconds of
          # tests/soak.rs after the suite, where streams receive through
          # packed buffer rings (the runner's kernel has none).
          - { kernel: "5.15.225", workarounds: "", features: "", ktls: "1" }
          - { kernel: "6.0.19", workarounds: "", features: "registered-ring" }
          - { kernel: "6.1.155", workarounds: "", features: "registered-ring", ktls: "1" }
          - { kernel: "6.12.117", workarounds: "", features: "packed-buffers,registered-ring,zero-copy-send", soak: "60" }
          - { kernel: "ubuntu-6.8.0-147", workarounds: "buffer-ring-reserved-check", features: "registered-ring,zero-copy-send", ktls: "1" }
          - { kernel: "6.18.63", workarounds: "", features: "packed-buffers,registered-ring,zero-copy-send", ktls: "1", soak: "60" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # The release build of the `build` job. If it cannot be had (it is kept
      # for a day, so a job run again later finds none), this job builds the
      # test binaries itself, as scripts/shared-build.sh says in a warning.
      - name: Fetch the release build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: release-build
          path: ${{ runner.temp }}
      - run: scripts/shared-build.sh unpack "$RUNNER_TEMP/release-build.tar.zst"
      - name: Install QEMU and a static busybox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 busybox-static cpio
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/kernels/linux-${{ matrix.kernel }}
          key: kernel-${{ matrix.kernel }}${{ matrix.ktls && '-ktls' || '' }}
      - run: scripts/kernels.sh ${{ matrix.kernel }}
        env:
          GIONG_TEST_EXPECT_KERNEL_WORKAROUNDS: ${{ matrix.workarounds }}
          GIONG_TEST_EXPECT_IO_URING_FEATURES: ${{ matrix.features }}
          KTLS: ${{ matrix.ktls || '0' }}
          SOAK_SECS: ${{ matrix.soak || '' }}
      - name: Keep the guest's log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.kernel }}-log
          path: target/kernels/linux-${{ matrix.kernel }}.log

  # The public API keeps the semver promise against the last release: no
  # breaking change between releases (scripts/semver.sh).
  semver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-semver-checks
        run: cargo install --locked cargo-semver-checks --version 0.51.0
      - run: scripts/semver.sh

  # Every job of this workflow passed. One name to require on main, so that
  # the jobs that are not required by themselves (Miri, the kernels, Docker,
  # the other server versions, loom, h2spec, the lowest dependency versions,
  # the simulation) hold a merge back as well.
  all-checks:
    needs: [lint, msrv, build, test, h2spec, servers, fallback, docker, tsan, miri, loom, minimal-versions, kernels, semver, sim]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null
