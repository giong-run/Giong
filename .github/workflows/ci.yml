name: CI

on:
  # `ready_for_review`: a draft runs the short set (job `plan`), so marking it ready
  # starts the full one.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A pull request in the merge queue: the same jobs, on main with the pull
  # request and those queued before it merged, before main moves.
  merge_group:
  # The release pull request is opened by GitHub Actions, which starts no
  # pull_request run; prepare-release.yml starts CI on its branch this way.
  workflow_dispatch:
  # A push to main: main.yml runs these jobs for a commit that no run in the
  # merge queue has tested.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the run of the push before it. A run
# on main is never cancelled (each has a group of its own): in a cancelled run
# `fallback` and `tsan` report a failure, as they must on a pull request, where
# a skipped required check would count as passed, and main would look broken
# when it is not.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  # The stable compiler of every job that does not name one (MSRV, nightly and
  # instr name their own). Pinned, not `stable`, so that a new Rust release
  # (new lints, a new target/ layout) cannot turn main red overnight and so that
  # scripts/preflight.sh runs the same compiler locally. Raise it in a pull
  # request of its own when a Rust release comes out.
  RUST_STABLE: "1.100.0"
  CARGO_TERM_COLOR: always
  # Network steps outlast a bad minute on a mirror (scripts/ci-net.sh says
  # why). cargo and rustup retry 3 times by default, crates.io and
  # static.rust-lang.org included; a test is never retried.
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # giong-postgres's tests start a throwaway PostgreSQL server from the
  # binaries the runner image ships (/usr/lib/postgresql/16/bin). Without
  # this they would skip, quietly, if the binaries went missing.
  GIONG_PG_REQUIRED: "1"
  # The same for giong-mysql and the runner's MySQL 8.0 (/usr/sbin/mysqld,
  # whose service is left stopped).
  GIONG_MYSQL_REQUIRED: "1"
  # And for giong-redis, whose redis-server the jobs below install.
  GIONG_REDIS_REQUIRED: "1"

jobs:
  # What this run needs (scripts/ci-scope.py). The merge queue, a dispatch and a push to
  # main run everything, repeated. A pull request runs every job once when it is ready
  # for review, a short set while it is a draft, and only `lint` and `msrv` when it
  # changes nothing that is built, tested or read by a test (the site, changelog.d/,
  # prose). Whatever a pull request ran, the merge queue runs the full set on main with
  # the change merged before main moves: what lands is tested exactly as before.
  # If this job fails, every job that needs it is skipped and `all-checks` fails.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      heavy: ${{ steps.plan.outputs.heavy }}
      rounds: ${{ steps.plan.outputs.rounds }}
      tsan: ${{ steps.plan.outputs.tsan }}
    steps:
      # On a pull request the checked-out commit merges the head into the base, so its
      # first parent is the base and the diff between the two is the pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft && '--draft' || '' }}
        run: |
          if [ "$EVENT" = pull_request ]; then
              git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files.txt"
          else
              : > "$RUNNER_TEMP/files.txt"
          fi
          python3 scripts/ci-scope.py --event "$EVENT" $DRAFT --explain < "$RUNNER_TEMP/files.txt" | tee -a "$GITHUB_OUTPUT"
          {
              echo "### CI plan: \`$(sed -n 's/^scope=//p' "$GITHUB_OUTPUT" | tail -n 1)\`"
              echo
              echo "docs: lint and msrv only. draft: lint, msrv, default features, build, tests once."
              echo "pr: every job, each suite once. full (merge queue): every job, every repetition."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # Crate versions agree, README images use absolute URLs that resolve on
      # crates.io, CHANGELOG.md is well formed and the site builds without a broken link.
      - run: python3 scripts/release.py check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The versions and what each checks live in scripts/msrv.sh, which
      # scripts/preflight.sh runs too.
      - name: "net: install the toolchains scripts/msrv.sh names"
        run: |
          for v in $(scripts/msrv.sh versions); do
              scripts/ci-net.sh retry -n 4 -t 600 -- rustup toolchain install "$v" --profile minimal --no-self-update
          done
      - run: scripts/msrv.sh

  # giong as most users build it: no features at all. Every other job turns
  # on all features, so code that only compiles, or only passes, with a
  # feature on (unstable-udp-offload, say) would go unseen. Both drivers.
  default-features:
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy
      - run: cargo clippy -p giong --all-targets -- -D warnings
      - run: sudo prlimit --pid $$ --memlock=unlimited:unlimited && cargo test -p giong
      - run: sudo prlimit --pid $$ --memlock=unlimited:unlimited && GIONG_DRIVER=epoll cargo test -p giong

  # The release build of every test binary, once for the whole run: fat LTO
  # makes it the slowest step by far, and the jobs `test`, `fallback`, `docker`
  # and `kernels` all run these binaries. They take this job's target/release
  # and then run the same cargo commands as before, which find it up to date
  # (scripts/shared-build.sh says how, and what makes that safe).
  build:
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - run: scripts/shared-build.sh pack "$RUNNER_TEMP/release-build.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build.tar.zst
          if-no-files-found: error
          # Packed with zstd already.
          compression-level: 0
          retention-days: 1
          # A run started again uploads it again.
          overwrite: true

  test:
    needs: [plan, build]
    # A required check that is skipped counts as passed, and a job is skipped
    # when one it needs fails: this one always runs, and fails by itself. It is
    # skipped on purpose only for a pull request that `plan` found to change no code.
    if: always() && needs.plan.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    env:
      # Five rounds in the merge queue, one on a pull request (job `plan`).
      ROUNDS: ${{ needs.plan.outputs.rounds || 5 }}
      # giong must choose io_uring by itself on the runner: if a runner kernel
      # ever refuses it, the run fails instead of quietly testing epoll only.
      GIONG_TEST_EXPECT_DRIVER: io_uring
      # The kernel TLS tests fail instead of skipping without the module.
      GIONG_KTLS_REQUIRED: 1
      # giong-postgres's tests through PgBouncer fail instead of skipping
      # without it.
      GIONG_PGBOUNCER_REQUIRED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: The plan and the build must have succeeded
        run: test "${{ needs.plan.result }}" = success && test "${{ needs.build.result }}" = success
      - run: uname -r
      # The release build of the `build` job. If it cannot be had (it is kept
      # for a day, so a job run again later finds none), this job builds the
      # test binaries itself, as scripts/shared-build.sh says in a warning.
      - name: "net: fetch the release build"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: release-build
          path: ${{ runner.temp }}
      - run: scripts/shared-build.sh unpack "$RUNNER_TEMP/release-build.tar.zst"
      # Ubuntu's Redis 7.0 and PgBouncer 1.22, from the cache of .deb files
      # (.github/actions/apt-install). The tests start their own servers; the
      # services apt starts are stopped. The kernel's tls module, so the
      # kernel TLS tests run.
      - name: "net: install redis-server and pgbouncer, load tls"
        uses: ./.github/actions/apt-install
        with:
          packages: redis-server pgbouncer
          stop-services: redis-server pgbouncer
          modules: tls
      # Linux 6.14 to 7.2 count every io_uring ring against the
      # locked-memory limit, summed over the runner user's processes, and
      # tests run runtimes side by side: lift the limit, so that each of them
      # gets io_uring (docs/DEPLOYMENT.md, "Locked-memory limit"). tests/
      # blocked.rs checks what happens under a low one.
      - run: ulimit -l && sudo prlimit --pid $$ --memlock=unlimited:unlimited && ulimit -l && scripts/check.sh test

  # HTTP/2 conformance: h2spec against giong-http's h2 example, over TLS
  # (HTTP/2 chosen through ALPN) with the strict cases too, and over plain TCP
  # with prior knowledge. On the plain port a connection that does not start
  # with the HTTP/2 preface is an HTTP/1.1 one, so the case that sends a broken
  # preface (3.5/2) runs over TLS only. h2spec is built from source at a pinned
  # commit (the Go checksum database checks the download).
  h2spec:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: "net: restore h2spec"
        id: h2spec
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/h2spec
          key: h2spec-v1.5.1-0.20220625142712-af83a65f0b62-${{ runner.os }}
      - name: "net: build h2spec"
        if: steps.h2spec.outputs.cache-hit != 'true'
        run: >
          scripts/ci-net.sh retry -n 4 -t 600 --
          go install github.com/summerwind/h2spec/cmd/h2spec@v1.5.1-0.20220625142712-af83a65f0b62
      - run: cargo build --release -p giong-http --features tls --example h2
      - name: Run h2spec
        run: |
          GIONG_WORKERS=2 target/release/examples/h2 127.0.0.1:8443 127.0.0.1:8080 &
          for _ in $(seq 100); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.1; done
          h2spec=$(go env GOPATH)/bin/h2spec
          "$h2spec" --strict --tls --insecure --port 8443 --timeout 5
          "$h2spec" --strict --port 8080 --timeout 5 \
            generic hpack http2/3.5/1 http2/4 http2/5 http2/6 http2/7 http2/8

  # HTTP/3 and QUIC conformance: h3spec against giong-http's h3 example
  # (`Server::serve_h3` on giong-quic, behind `unstable-http3`). h3spec sends
  # what a client must not send, on the QUIC and on the HTTP/3 level, and
  # checks that the server answers with the right error. Its release binary
  # is checked against the hash GitHub publishes for it before it runs.
  h3spec:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: "net: fetch h3spec"
        run: |
          scripts/ci-net.sh fetch https://github.com/kazu-yamamoto/h3spec/releases/download/v0.1.15/h3spec-linux-x86_64 \
            c3c5f497153f4ba81f82023791ba7f9a4bc46d4141211e614196f141c5996830 h3spec
          chmod +x h3spec
      - run: cargo build --release -p giong-http --features unstable-http3 --example h3
      - name: Run h3spec
        run: |
          target/release/examples/h3 127.0.0.1:8443 &
          sleep 2
          ./h3spec --no-validate --timeout 5000 127.0.0.1 8443

  # The database crates against the other server versions they support; the
  # jobs above use the runner's PostgreSQL 16, MySQL 8.0 and Ubuntu's Redis
  # 7.0. Each entry installs one server and runs one crate's tests on it.
  servers:
    name: servers (${{ matrix.server }})
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    # These take a few minutes. A server that does not start, or a test that
    # waits for one for ever, must not hold a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Runners are shared by every pull request and the merge queue: a pull
      # request takes four at a time here, the merge queue all of them.
      max-parallel: ${{ needs.plan.outputs.scope == 'full' && 13 || 4 }}
      matrix:
        include:
          - { server: postgres 14, crate: giong-postgres, postgres: "14" }
          - { server: postgres 15, crate: giong-postgres, postgres: "15" }
          - { server: postgres 17, crate: giong-postgres, postgres: "17" }
          - { server: postgres 18, crate: giong-postgres, postgres: "18" }
          # `sha256` is the archive's hash, checked before it is unpacked:
          # TLS protects the download, the hash protects against a changed
          # archive on the server. Redis's come from github.com/redis/redis-hashes.
          - { server: mysql 8.4, crate: giong-mysql, mysql: "8.4.3", sha256: b614e51fddac1bbec1dd9cf0a96fcf2426007a8dbbbc3f6b17c555e3b92b017e }
          - { server: mysql 9.1, crate: giong-mysql, mysql: "9.1.0", sha256: 8d853ff095a72cb263e22dcca2b3ce6e3bd49cb2e05b89aeddb0bab626f4b102 }
          # MariaDB comes from its apt repository, whose packages apt checks
          # against MariaDB's signing key; the key is checked by fingerprint.
          # The repository has 10.6 for Ubuntu 22.04 and older only.
          - { server: mariadb 10.6, crate: giong-mysql, mariadb: "10.6", os: ubuntu-22.04 }
          - { server: mariadb 10.11, crate: giong-mysql, mariadb: "10.11" }
          - { server: mariadb 11.4, crate: giong-mysql, mariadb: "11.4" }
          - { server: mariadb 11.8, crate: giong-mysql, mariadb: "11.8" }
          - { server: redis 6.2, crate: giong-redis, redis: "6.2.16", sha256: 846bff83c26d827d49f8cc8114ea9d1e72eea1169f7de36b8135ea2cec104e7d }
          - { server: redis 7.4, crate: giong-redis, redis: "7.4.1", sha256: bc34b878eb89421bbfca6fa78752343bf37af312a09eb0fae47c9575977dfaa2 }
          - { server: valkey 8.0, crate: giong-redis, valkey: "8.0.1", sha256: 1e1d6dfbed2f932a87afbc7402be050a73974a9b19a9116897e537a6638e5e1d }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      # Each server comes from a cache that holds what it was set up from
      # (scripts/ci-servers.sh says what, and how each download is checked):
      # a run goes to the mirrors only for a new version, a new runner image
      # or a change to the script.
      - name: "net: cache key"
        id: key
        env:
          SERVER: ${{ matrix.server }}
          SCRIPTS: ${{ hashFiles('scripts/ci-servers.sh', 'scripts/ci-apt.sh') }}
        run: echo "key=server-${SERVER// /-}-$ImageOS-$ImageVersion-${SCRIPTS:0:16}" >> "$GITHUB_OUTPUT"
      - name: "net: restore ${{ matrix.server }}"
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ci-server
          key: ${{ steps.key.outputs.key }}
      - name: "net: set up ${{ matrix.server }}"
        env:
          POSTGRES: ${{ matrix.postgres }}
          MYSQL: ${{ matrix.mysql }}
          MARIADB: ${{ matrix.mariadb }}
          REDIS: ${{ matrix.redis }}
          VALKEY: ${{ matrix.valkey }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          cache="$HOME/ci-server"
          mkdir -p "$cache"
          if [ -n "$POSTGRES" ]; then set -- postgres "$POSTGRES" "$cache"
          elif [ -n "$MYSQL" ]; then set -- mysql "$MYSQL" "$SHA256" "$cache"
          elif [ -n "$MARIADB" ]; then set -- mariadb "$MARIADB" "$cache"
          elif [ -n "$REDIS" ]; then set -- redis "$REDIS" "$SHA256" "$cache"
          else set -- valkey "$VALKEY" "$SHA256" "$cache"
          fi
          scripts/ci-servers.sh "$@" >> "$GITHUB_ENV"
      - name: "net: keep ${{ matrix.server }} for the next run"
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ci-server
          key: ${{ steps.key.outputs.key }}
      # The locked-memory limit is lifted as in the test job.
      - run: sudo prlimit --pid $$ --memlock=unlimited:unlimited && cargo test -p ${{ matrix.crate }} --all-features

  # The io_uring of older kernels, forced on the runner's newer one: without
  # the optional io_uring features (GIONG_IO_URING_OFF), then also on the
  # setup tiers of kernels older than 6.1 (GIONG_RING_TIER); and the epoll
  # driver (GIONG_DRIVER=epoll). What `scripts/check.sh fallback` runs one
  # after the other, as four jobs side by side.
  fallback-tiers:
    name: fallback (${{ matrix.tier }})
    needs: [plan, build]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tier: [no-features, coop, basic, epoll]
    env:
      ROUNDS: ${{ needs.plan.outputs.rounds }}
      GIONG_TEST_EXPECT_DRIVER: io_uring
      GIONG_KTLS_REQUIRED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      # The release build of the `build` job. If it cannot be had (it is kept
      # for a day, so a job run again later finds none), this job builds the
      # test binaries itself, as scripts/shared-build.sh says in a warning.
      - name: "net: fetch the release build"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: release-build
          path: ${{ runner.temp }}
      - run: scripts/shared-build.sh unpack "$RUNNER_TEMP/release-build.tar.zst"
      # Ubuntu's Redis 7.0, as in the test job, and the kernel's tls module.
      - name: "net: install redis-server, load tls"
        uses: ./.github/actions/apt-install
        with:
          packages: redis-server
          stop-services: redis-server
          modules: tls
      # The locked-memory limit is lifted as in the test job.
      - run: sudo prlimit --pid $$ --memlock=unlimited:unlimited && scripts/check.sh fallback ${{ matrix.tier }}

  # The required check: every tier above passed. It always runs, because a
  # skipped required check counts as passed.
  fallback:
    needs: [plan, fallback-tiers]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: >
          test "${{ needs.fallback-tiers.result }}" = success ||
          { test "${{ needs.plan.result }}" = success && test "${{ needs.plan.outputs.heavy }}" = false &&
          test "${{ needs.fallback-tiers.result }}" = skipped; }

  # The epoll driver where it is needed: a container with Docker's default
  # seccomp profile, which blocks io_uring. Nothing names a driver, so the
  # tests also show that giong falls back to epoll by itself. The database
  # crates' tests skip here (no servers in the image).
  docker:
    needs: [plan, build]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      # The release build of the `build` job. If it cannot be had (it is kept
      # for a day, so a job run again later finds none), this job builds the
      # test binaries itself, as scripts/shared-build.sh says in a warning.
      - name: "net: fetch the release build"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: release-build
          path: ${{ runner.temp }}
      - run: scripts/shared-build.sh unpack "$RUNNER_TEMP/release-build.tar.zst"
      - name: List the test binaries
        run: |
          mkdir -p target
          cargo test --release --workspace --all-features --no-run --message-format=json |
            python3 -c '
          import json, sys
          for line in sys.stdin:
              msg = json.loads(line)
              if msg.get("reason") == "compiler-artifact" and msg.get("executable") and msg["profile"]["test"]:
                  print(msg["executable"])
          ' > target/test-binaries.txt
          wc -l target/test-binaries.txt
      # A container cannot load kernel modules, but uses the host's: kernel
      # TLS on the epoll driver, inside the container.
      - name: "net: load the kernel's tls module, so the kernel TLS tests run"
        uses: ./.github/actions/apt-install
        with:
          modules: tls
      - name: "net: pull ubuntu:24.04"
        run: scripts/ci-net.sh retry -n 5 -t 300 -- docker pull -q ubuntu:24.04
      - name: Run them in a container with the default seccomp profile
        run: |
          docker info --format '{{.SecurityOptions}}' | grep -q seccomp
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -v /etc/ssl/certs:/etc/ssl/certs:ro \
            -e GIONG_TEST_EXPECT_DRIVER=epoll -e GIONG_KTLS_REQUIRED=1 ubuntu:24.04 sh -ec '
              for t in $(cat target/test-binaries.txt); do
                echo "== $t"
                "$t" -q
              done'

  # The tests that share a port between workers, the runtime's own and
  # giong-http's, in a container under gVisor (runsc): GKE Sandbox and many
  # sandboxes for AI agents run it, and its network stack records SO_REUSEPORT
  # at the bind, unlike Linux (scripts/gvisor.sh).
  gvisor:
    needs: [plan, build]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: "net: fetch the release build"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: release-build
          path: ${{ runner.temp }}
      - run: scripts/shared-build.sh unpack "$RUNNER_TEMP/release-build.tar.zst"
      - run: scripts/gvisor.sh

  # giong-http with its defaults, in a container limited to 128 MiB, under
  # hundreds of uploads that stop one byte short: it must not be OOM-killed,
  # and a well-behaved client mixed in must keep getting answers. One and four
  # workers, on epoll and on io_uring (scripts/slow-uploads.sh). Then in 48 MiB
  # under idle connections until it refuses them for low memory: it must not
  # be OOM-killed, and must keep serving the ones it holds
  # (scripts/idle-connections.sh).
  slow-uploads:
    needs: [plan, build]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: "net: fetch the release build"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: release-build
          path: ${{ runner.temp }}
      - run: scripts/shared-build.sh unpack "$RUNNER_TEMP/release-build.tar.zst"
      # Built with the test binaries already (`cargo test` builds examples),
      # with the same features, so this finds it up to date.
      - run: cargo build --release --workspace --all-features --example defaults
      - run: scripts/slow-uploads.sh target/release/examples/defaults
      - run: scripts/idle-connections.sh target/release/examples/defaults

  # ThreadSanitizer over every test: twice on io_uring and once on the epoll
  # driver, which hands file operations to threads of its own. Three jobs side
  # by side, each with its own build (the standard library included). A pull
  # request runs the first io_uring run and the epoll one; the merge queue all
  # three (job `plan`).
  tsan-runs:
    name: tsan (${{ matrix.driver }}, run ${{ matrix.run }})
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tsan) }}
    env:
      GIONG_TEST_EXPECT_DRIVER: io_uring
      GIONG_KTLS_REQUIRED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rust-src
      # ThreadSanitizer cannot map its shadow memory with the runner's default
      # address-space randomisation.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      # Ubuntu's Redis 7.0, as in the test job, and the kernel's tls module.
      - name: "net: install redis-server, load tls"
        uses: ./.github/actions/apt-install
        with:
          packages: redis-server
          stop-services: redis-server
          modules: tls
      # The locked-memory limit is lifted as in the test job.
      - name: ThreadSanitizer on ${{ matrix.driver }}
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          if [ "${{ matrix.driver }}" = epoll ]; then export GIONG_DRIVER=epoll; fi
          ROUNDS=1 scripts/check.sh tsan

  # The required check: every ThreadSanitizer job above passed.
  tsan:
    needs: [plan, tsan-runs]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: >
          test "${{ needs.tsan-runs.result }}" = success ||
          { test "${{ needs.plan.result }}" = success && test "${{ needs.plan.outputs.heavy }}" = false &&
          test "${{ needs.tsan-runs.result }}" = skipped; }

  # The unsafe code under Miri, which checks every access against Rust's
  # memory and aliasing rules: the unit tests and the tests it can run, on the
  # epoll driver (scripts/check.sh says which).
  miri:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri, rust-src
      - run: scripts/check.sh miri

  # Model-check the wake-up handshakes in src/notify.rs with loom, then run the
  # same race on the runner's real CPUs.
  loom:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - run: scripts/check.sh loom

  # The deterministic simulation (sim/README.md): the epoll driver on a
  # simulated kernel, with faults chosen by a seed; scenarios for HTTP, TLS,
  # HTTP/2, Redis, PostgreSQL and files, months of simulated uptime, and the
  # core crate's tests with and without faults. A failure prints its seed.
  sim:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy
      - run: scripts/check.sh sim

  # The core crate's tests with each of its direct dependencies at the lowest
  # version its Cargo.toml allows, so that the floors there are checked, not
  # assumed: io-uring 0.7.0 to 0.7.14 once hung a busy worker's I/O, which a
  # fresh lockfile (with the newest versions) never shows. Only the core crate
  # for now; the other crates' floors are not all consistent yet, and a crate
  # joins `members` here once they are.
  minimal-versions:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: Resolve the direct dependencies to their lowest versions
        run: |
          sed -i 's/^members = \[.*\]$/members = ["."]/' Cargo.toml
          grep -q '^members = \["."\]$' Cargo.toml
          cargo +nightly update -Z direct-minimal-versions
          cargo tree -p giong --depth 1 -e normal
      # The locked-memory limit is lifted as in the test job.
      - run: sudo prlimit --pid $$ --memlock=unlimited:unlimited && cargo test --release -p giong --all-features

  # The whole suite on real 6.0 and 6.1 kernels, each booted in QEMU (KVM),
  # on 5.15, whose io_uring lacks buffer rings: giong runs on epoll there, and
  # on the kernel Ubuntu 24.04 ships, whose buffer-ring bug (6.8.0-135 and
  # later) giong works around to stay on io_uring. Each run checks the driver
  # giong chose by itself and the kernel bugs it had to work around.
  kernels:
    needs: [plan, build]
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Four at a time on a pull request, all six in the merge queue (see servers).
      max-parallel: ${{ needs.plan.outputs.scope == 'full' && 6 || 4 }}
      matrix:
        include:
          # ktls: the guest loads the tls module and the kernel TLS tests
          # must run (5.15 on epoll, 6.1 and 6.8 without key updates, 6.18
          # with them). 6.0 is left out: giong-tls refuses its kernel TLS,
          # which can crash the kernel when a connection closes. features:
          # the optional io_uring features giong must find. soak: seconds of
          # tests/soak.rs after the suite, where streams receive through
          # packed buffer rings (the runner's kernel has none).
          - { kernel: "5.15.225", workarounds: "", features: "", ktls: "1" }
          - { kernel: "6.0.19", workarounds: "", features: "registered-ring" }
          - { kernel: "6.1.155", workarounds: "", features: "registered-ring", ktls: "1" }
          - { kernel: "6.12.117", workarounds: "", features: "packed-buffers,registered-ring,zero-copy-send", soak: "60" }
          - { kernel: "ubuntu-6.8.0-147", workarounds: "buffer-ring-reserved-check", features: "registered-ring,zero-copy-send", ktls: "1" }
          - { kernel: "6.18.63", workarounds: "", features: "packed-buffers,registered-ring,zero-copy-send", ktls: "1", soak: "60" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      # The release build of the `build` job. If it cannot be had (it is kept
      # for a day, so a job run again later finds none), this job builds the
      # test binaries itself, as scripts/shared-build.sh says in a warning.
      - name: "net: fetch the release build"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: release-build
          path: ${{ runner.temp }}
      - run: scripts/shared-build.sh unpack "$RUNNER_TEMP/release-build.tar.zst"
      - name: "net: install QEMU and a static busybox"
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86 busybox-static cpio
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/kernels/linux-${{ matrix.kernel }}
          key: kernel-${{ matrix.kernel }}${{ matrix.ktls && '-ktls' || '' }}
      - run: scripts/kernels.sh ${{ matrix.kernel }}
        env:
          GIONG_TEST_EXPECT_KERNEL_WORKAROUNDS: ${{ matrix.workarounds }}
          GIONG_TEST_EXPECT_IO_URING_FEATURES: ${{ matrix.features }}
          KTLS: ${{ matrix.ktls || '0' }}
          SOAK_SECS: ${{ matrix.soak || '' }}
      - name: "net: keep the guest's log"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.kernel }}-log
          path: target/kernels/linux-${{ matrix.kernel }}.log

  # The public API keeps the semver promise against the last release: no
  # breaking change between releases (scripts/semver.sh).
  semver:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: "net: restore cargo-semver-checks"
        id: semver-checks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: cargo-semver-checks-0.51.0-${{ env.RUST_STABLE }}-${{ runner.os }}
      - name: "net: install cargo-semver-checks"
        if: steps.semver-checks.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-semver-checks --version 0.51.0
      - run: scripts/semver.sh

  # Speed and memory thresholds: instructions per operation on the hot paths
  # (runtime, TCP/UDP/files, HTTP/1.1, HTTP/2, TLS, giong-web, the database
  # clients), counted by callgrind, and heap per idle connection, on both
  # drivers, against bench/instr/baseline.csv (scripts/instr.py). The counts
  # repeat within 0.1% on a shared runner, so a hot path made 1% slower fails.
  instr:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # The compiler of the baseline: bench/instr/rust-toolchain.toml
          # (scripts/instr.py refuses to run with another).
          toolchain: 1.97.0
      - name: "net: install valgrind"
        uses: ./.github/actions/apt-install
        with:
          packages: valgrind
      - run: uname -r
      - run: scripts/instr.py check
      # The counts of this run and a baseline.csv made from them, to commit
      # when a change is meant to move the counts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: instr
          path: target/instr/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # Proofs with the Kani model checker for the unsafe core: the slab, the
  # receive buffer pool against a model of the kernel's buffer rings,
  # KernelBox, and the lifetime of an io_uring operation across cancel and
  # completion (docs/kani.md says what each proves and within which bounds).
  # Kani's version is pinned: it brings its own nightly compiler and CBMC.
  kani:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: "net: restore kani-verifier"
        id: kani-verifier
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
          key: kani-verifier-0.68.0-${{ env.RUST_STABLE }}-${{ runner.os }}
      - name: "net: install kani-verifier"
        if: steps.kani-verifier.outputs.cache-hit != 'true'
        run: cargo install --locked kani-verifier --version 0.68.0
      # Its own nightly compiler and CBMC, from GitHub's releases.
      - name: "net: kani setup"
        run: scripts/ci-net.sh retry -n 4 -t 900 -- cargo kani setup
      # Two proofs at a time where they fit the runner's 16 GB (check.sh runs
      # the largest alone).
      - run: KANI_JOBS=2 scripts/check.sh kani

  # giong-quic by itself, as a user who depends on it alone builds it:
  # format, lints, docs, and its tests, which run its own client against
  # its own server and quinn against it.
  quic:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: giong-quic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # As in the `test` job: every runtime of the tests gets io_uring.
      - run: ulimit -l && sudo prlimit --pid $$ --memlock=unlimited:unlimited && ulimit -l && cargo test

  # musl, the C library of Alpine and of static Linux binaries: what differs
  # from glibc is only seen by building for it (recvmmsg takes an unsigned
  # `flags` there, for one) and by running there (strerror's words differ).
  # Lints, then the tests on the runner, on io_uring, and in an Alpine
  # container with Docker's default seccomp profile, on epoll. The binaries
  # are static, so the container needs nothing installed. The database
  # clients' tests skip: they are plain Rust over TCP, and run in `test`.
  musl:
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    env:
      GIONG_PG_REQUIRED: "0"
      GIONG_MYSQL_REQUIRED: "0"
      GIONG_REDIS_REQUIRED: "0"
      # ring's C code is built with musl's compiler wrapper.
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          targets: x86_64-unknown-linux-musl
          components: clippy
      - name: "net: install musl-tools"
        uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      - run: >
          cargo clippy --workspace --all-targets --all-features
          --target x86_64-unknown-linux-musl -- -D warnings
      # As in the `test` job: every runtime of the tests gets io_uring.
      - run: >
          sudo prlimit --pid $$ --memlock=unlimited:unlimited &&
          GIONG_TEST_EXPECT_DRIVER=io_uring
          cargo test --workspace --all-features --target x86_64-unknown-linux-musl
      - name: List the test binaries
        run: |
          cargo test --workspace --all-features --target x86_64-unknown-linux-musl \
            --no-run --message-format=json |
            python3 -c '
          import json, sys
          for line in sys.stdin:
              msg = json.loads(line)
              if msg.get("reason") == "compiler-artifact" and msg.get("executable") and msg["profile"]["test"]:
                  print(msg["executable"])
          ' > target/musl-test-binaries.txt
          wc -l target/musl-test-binaries.txt
      - name: "net: pull alpine:3.22"
        run: scripts/ci-net.sh retry -n 5 -t 300 -- docker pull -q alpine:3.22
      - name: Run them in Alpine
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            -e GIONG_TEST_EXPECT_DRIVER=epoll alpine:3.22 sh -ec '
              for t in $(cat target/musl-test-binaries.txt); do
                echo "== $t"
                "$t" -q
              done'

  # The macOS and Windows workflows, run from here outside pull requests (the
  # merge queue, a push to main that no queue run tested, a dispatch), so that
  # `all-checks` fails when they do: main requires only this workflow's checks,
  # and a red macOS run in the queue once merged #336 and broke main on macOS.
  # A pull request runs them as workflows of their own, which do not gate
  # merging; their `plan` sees the caller's event, so here they run in full.
  macos:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/macos.yml

  windows:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/windows-runtime.yml

  # Every job of this workflow passed. One name to require on main, so that
  # the jobs that are not required by themselves (Miri, Kani, the kernels,
  # Docker, the other server versions, loom, h2spec, h3spec, the lowest dependency
  # versions, the simulation, gVisor, musl) hold a merge back as well. When `plan` chose a
  # short set (a draft, or a pull request that changes no code), the jobs it left
  # out may be skipped; `plan`, `lint` and `msrv` must pass in any case, and in the
  # merge queue every job must.
  all-checks:
    needs: [plan, lint, msrv, default-features, build, test, h2spec, h3spec, servers, fallback, docker, gvisor, slow-uploads, tsan, miri, loom, minimal-versions, kernels, semver, instr, kani, sim, quic, musl, macos, windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          HEAVY: ${{ needs.plan.outputs.heavy }}
          EVENT: ${{ github.event_name }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          # On a pull request macOS and Windows run as workflows of their own.
          if [ "$EVENT" = pull_request ]; then NEEDS="$(jq 'del(.macos, .windows)' <<<"$NEEDS")"; fi
          if [ "$HEAVY" = false ]; then
              jq -e '(.plan.result == "success" and .lint.result == "success" and .msrv.result == "success")
                  and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" > /dev/null
          else
              jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null
          fi
