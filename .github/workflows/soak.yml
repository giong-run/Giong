name: Soak

# Two hours of connection churn, UDP, file and cross-worker traffic every night
# (tests/soak.rs), and two hours of TLS handshakes, traffic and interrupted
# operations, in the process and with kernel TLS (giong-tls/tests/soak.rs),
# each followed by checks that no descriptor, memory or driver state was left
# behind. Run it by hand with another duration from the Actions tab.
# Each twice: on the runner's kernel, and on Linux 6.18 booted in QEMU, where
# streams receive through packed buffer rings (6.12 and newer), which cut a
# receive wherever a shared buffer fills up, and where kernel TLS takes new
# keys on a live connection (6.14 and newer).
# Then years of simulated uptime under hostile faults (sim/README.md), on new
# seeds every night: rare fault combinations show up only after thousands of
# seeds, more than the per-PR run can afford.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to run
        default: "120"
      sim_from:
        description: First seed of the simulated long runs (default changes every night)
        default: ""

permissions:
  contents: read

env:
  # The stable compiler of every job that does not name one (MSRV, nightly and
  # instr name their own). Pinned, not `stable`, so that a new Rust release
  # (new lints, a new target/ layout) cannot turn main red overnight and so that
  # scripts/preflight.sh runs the same compiler locally. Raise it in a pull
  # request of its own when a Rust release comes out.
  RUST_STABLE: "1.100.0"

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        workload: [runtime, tls]
    env:
      # The TLS soak must reach the kernel: the module is loaded below.
      GIONG_KTLS_REQUIRED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - run: uname -r && nproc
      - name: Load the kernel's tls module, so the TLS soak covers kernel TLS
        if: matrix.workload == 'tls'
        run: sudo modprobe tls || { sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe tls; }
      - name: Soak
        run: SOAK_SECS=$(( ${{ inputs.minutes || '120' }} * 60 )) scripts/check.sh soak ${{ matrix.workload }}

  soak-packed-buffers:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { workload: runtime, package: giong, ktls: "0" }
          - { workload: tls, package: giong-tls, ktls: "1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - name: Install QEMU and a static busybox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 busybox-static cpio
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/kernels/linux-6.18.63
          key: kernel-6.18.63${{ matrix.ktls == '1' && '-ktls' || '' }}
      - name: Soak on Linux 6.18
        run: |
          secs=$(( ${{ inputs.minutes || '120' }} * 60 ))
          bin=$(cargo test --release -p ${{ matrix.package }} --all-features --test soak --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "soak") | .executable')
          TEST_BINARIES="$bin" KTLS=${{ matrix.ktls }} SOAK_SECS=$secs TIMEOUT=$(( secs + 1800 )) scripts/kernels.sh 6.18.63
      - name: Check that receives were cut, so packed buffer rings were in use
        if: matrix.workload == 'runtime'
        run: grep -E ', [1-9][0-9]* messages received in pieces' target/kernels/linux-6.18.63.log
      - name: Check that the kernel encrypted connections
        if: matrix.workload == 'tls'
        run: grep -E '\([0-9]+ resumed sessions, [1-9][0-9]* stream ends encrypted by the kernel\)' target/kernels/linux-6.18.63.log
      - name: Keep the guest's log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-${{ matrix.workload }}-linux-6.18.63-log
          path: target/kernels/linux-6.18.63.log

  sim-long-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      # 1200 seeds of 521 simulated days each (about 1,700 simulated years),
      # starting where the previous night stopped. A failure prints its seed;
      # replay it with GIONG_SIM_SEED=<seed> GIONG_SIM_SOAK_DAYS=3650.
      - name: Hostile soak in simulated time
        env:
          SIM_FROM: ${{ inputs.sim_from }}
          RUN: ${{ github.run_number }}
        run: SIM_LONG_FROM="${SIM_FROM:-$(( RUN * 1200 ))}" scripts/check.sh sim-long
