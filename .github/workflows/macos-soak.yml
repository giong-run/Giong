# Temporary: the lost wake-up race repeated on macOS.
name: macOS wake repeat
on:
  push:
    branches: ["soak/macos-*"]
permissions:
  contents: read
jobs:
  wake:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Repeat
        run: |
          cargo test --release -p giong --test wake --no-run
          fails=0
          for i in $(seq 1 20); do
            echo "== $i"
            cargo test --release -q -p giong --test wake -- --ignored 2>&1 | grep -E "test |left|right" || true
            cargo test --release -q -p giong --test wake -- --ignored >/dev/null 2>&1 || fails=$((fails+1))
          done
          echo "failed runs: $fails"
          [ "$fails" = 0 ]
