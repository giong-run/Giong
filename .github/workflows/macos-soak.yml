# Temporary: tests/balance.rs repeated on macOS, release and TSan.
name: macOS balance repeat
on:
  push:
    branches: ["soak/macos-*"]
permissions:
  contents: read
jobs:
  balance:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        mode: [release, tsan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.mode == 'tsan' && 'nightly' || 'stable' }}
          components: ${{ matrix.mode == 'tsan' && 'rust-src' || '' }}
      - name: Repeat
        env:
          GIONG_TEST_EXPECT_DRIVER: kqueue
        run: |
          if [ "${{ matrix.mode }}" = tsan ]; then
            export RUSTFLAGS="-Zsanitizer=thread --cfg giong_tsan" TSAN_OPTIONS=halt_on_error=1
            cmd="cargo +nightly test -Zbuild-std --target aarch64-apple-darwin -p giong --all-features --test balance"
          else
            cmd="cargo test --release -p giong --all-features --test balance"
          fi
          $cmd --no-run
          for i in $(seq 1 40); do echo "== $i"; $cmd -- with_exact a_burst --nocapture || exit 1; done
