syntax = "proto3";

package hello.v1;

service Greeter {
  // One greeting.
  rpc SayHello(HelloRequest) returns (HelloReply);
  // The same greeting `count` times, one message each.
  rpc SayHelloMany(HelloRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
  uint32 count = 2;
}

message HelloReply {
  string message = 1;
}
