[package]
name = "rest-api"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
description = "A complete REST API on giong: PostgreSQL, a Redis cache, HTTPS"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
giong = { path = "../.." }
giong-mcp = { path = "../../giong-mcp", features = ["web"] }
giong-postgres = { path = "../../giong-postgres" }
giong-redis = { path = "../../giong-redis" }
giong-tls = { path = "../../giong-tls" }
giong-web = { path = "../../giong-web", features = ["serde", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
giong-http = { path = "../../giong-http", features = ["client"] }
libc = "0.2"
rcgen = "0.13"
# For the Rust samples of the repository's Markdown, compiled as doctests of
# this crate (see `markdown` in src/lib.rs): the crates and the Tokio-ecosystem
# crates they show.
giong-compat = { path = "../../giong-compat", features = ["tls"] }
giong-mysql = { path = "../../giong-mysql" }
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio = { version = "1.13", default-features = false, features = ["io-util"] }
