[package]
name = "rest-api"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
description = "A complete REST API on giong: PostgreSQL, a Redis cache, HTTPS"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
giong = { path = "../.." }
giong-postgres = { path = "../../giong-postgres" }
giong-redis = { path = "../../giong-redis" }
giong-tls = { path = "../../giong-tls" }
giong-web = { path = "../../giong-web", features = ["serde", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
giong-http = { path = "../../giong-http", features = ["client"] }
libc = "0.2"
rcgen = "0.13"
