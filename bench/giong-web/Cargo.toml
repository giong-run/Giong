[package]
name = "bench-giong-web"
version = "0.1.0"
edition = "2021"

[dependencies]
giong = { path = "../.." }
giong-web = { path = "../../giong-web", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# giong-web's libdeflate path for small gzip bodies (bench/results/web-fast-gzip).
fast-gzip = ["giong-web/fast-gzip"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
