[package]
name = "bench-http-client-tokio"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

