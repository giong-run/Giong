[package]
name = "bench-db-path-tokio"
version = "0.1.0"
edition = "2021"
publish = false

# The HTTP -> database -> HTTP path on axum and the Tokio ecosystem, for
# bench/db-path.sh: tokio-postgres through deadpool-postgres, or SQLx for
# PostgreSQL and MySQL, on a current-thread runtime.
[dependencies]
axum = "0.8"
deadpool-postgres = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "mysql"] }
tokio = { version = "1", features = ["rt", "net", "macros"] }
tokio-postgres = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
