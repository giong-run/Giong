// Message shapes for the giong-proto vs prost benchmark.
syntax = "proto3";

package bench;

import "google/protobuf/descriptor.proto";

// A request header: scalars only.
message Small {
  int32 id = 1;
  int64 timestamp = 2;
  uint32 flags = 3;
  bool urgent = 4;
  double score = 5;
  fixed64 trace_id = 6;
}

// A user record: mostly strings.
message User {
  uint64 id = 1;
  string name = 2;
  string email = 3;
  string country = 4;
  repeated string tags = 5;
  bytes avatar_hash = 6;
  map<string, string> attributes = 7;
}

message Item {
  uint64 id = 1;
  string name = 2;
  int64 price_cents = 3;
  repeated string labels = 4;
  repeated int32 stock_by_store = 5;
}

// A list response: repeated nested messages.
message ItemList {
  repeated Item items = 1;
  string next_page_token = 2;
}

// A large binary payload.
message Blob {
  string name = 1;
  bytes data = 2;
}

// Keeps the descriptor types in the generated code.
message Descriptors {
  google.protobuf.FileDescriptorSet set = 1;
}
