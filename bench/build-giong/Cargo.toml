[package]
name = "ghello"
version = "0.1.0"
edition = "2021"
[dependencies]
giong = "=1.3.0"
giong-web = { version = "=1.3.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
[profile.fastdev]
inherits = "dev"
debug = "line-tables-only"
[profile.small]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true

[workspace]
