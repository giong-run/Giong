[package]
name = "bench-fs"
version = "0.1.0"
edition = "2021"

[dependencies]
giong = { path = "../.." }
tokio = { version = "1", features = ["rt", "fs", "sync"] }
monoio = "0.2"
compio = { version = "0.19", features = ["runtime", "fs", "io-uring"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

