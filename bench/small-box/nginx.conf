# nginx for bench/small-box.sh: one worker, the same routes as the other
# servers. small-box.sh replaces @DIR@ (a scratch directory), @CERT@, @KEY@
# and @KTLS@ (empty, or "ssl_conf_command Options KTLS;" for kernel TLS).
worker_processes 1;
worker_rlimit_nofile 1100000;
pid @DIR@/nginx.pid;
error_log @DIR@/error.log warn;
events {
    worker_connections 1000000;
}
http {
    access_log off;
    # Idle connections stay as long as the measurement needs (the other
    # servers get the same).
    keepalive_timeout 3600s;
    keepalive_requests 10000000;
    client_body_temp_path @DIR@/body;
    proxy_temp_path @DIR@/proxy;
    fastcgi_temp_path @DIR@/fastcgi;
    uwsgi_temp_path @DIR@/uwsgi;
    scgi_temp_path @DIR@/scgi;
    # Plain HTTP on 3013, HTTPS (HTTP/1.1 and HTTP/2 through ALPN) on 3014.
    server {
        listen 3013 reuseport backlog=65535;
        listen 3014 ssl reuseport backlog=65535;
        http2 on;
        ssl_certificate @CERT@;
        ssl_certificate_key @KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        @KTLS@
        location = /json {
            default_type application/json;
            return 200 '{"message":"Hello, World!"}';
        }
        # nginx reads the whole body before handing a request on, here to a
        # backend in the same process (proxy_request_buffering is on by
        # default): bodies over client_body_buffer_size (16 KiB) go to a
        # temporary file, not memory.
        location = /upload {
            client_max_body_size 2m;
            proxy_pass http://127.0.0.1:3015;
        }
    }
    server {
        listen 127.0.0.1:3015;
        location / {
            return 200 'ok';
        }
    }
}
