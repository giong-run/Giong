[package]
name = "bench-udp-echo"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
giong = { path = "../..", features = ["unstable-udp-offload"] }
libc = "0.2"
tokio = { version = "1", features = ["rt", "net"] }

[profile.release]
