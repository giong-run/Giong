[package]
name = "bench-rest-api-axum"
version = "0.1.0"
edition = "2021"

# The API of examples/rest-api, on axum and the Tokio ecosystem: the same
# routes, SQL, cache and middleware, for bench/rest-api.sh.
[dependencies]
axum = "0.8"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
deadpool-postgres = "0.14"
redis = { version = "1", default-features = false, features = ["aio", "tokio-comp", "connection-manager"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tower-http = { version = "0.6", features = ["compression-gzip", "request-id", "timeout"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
