[package]
name = "ahello"
version = "0.1.0"
edition = "2021"
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.6", features = ["compression-full", "timeout", "request-id", "trace", "util"] }
tracing-subscriber = "0.3"
[profile.fastdev]
inherits = "dev"
debug = "line-tables-only"
[profile.small]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true

[workspace]
