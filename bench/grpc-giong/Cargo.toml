# giong-grpc for bench/grpc.sh: the server, and the load generator that
# measures giong-grpc's client.
[package]
name = "bench-grpc-giong"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
giong = { path = "../.." }
giong-http = { path = "../../giong-http" }
giong-grpc = { path = "../../giong-grpc" }
giong-proto = { path = "../../giong-proto" }

[build-dependencies]
giong-grpc-build = { path = "../../giong-grpc-build" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
