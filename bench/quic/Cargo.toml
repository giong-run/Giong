[package]
name = "bench-quic"
version = "0.1.0"
edition = "2021"
publish = false

# The QUIC decision benchmark (plan 1.1-1.4, section 4): quinn-proto driven
# by a giong UdpSocket against quinn on Tokio. Branch-only prototype.

[dependencies]
giong = { path = "../..", features = ["unstable-udp-offload"] }
giong-quic = { path = "../../giong-quic" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
quinn-udp = { version = "0.5", default-features = false, features = ["tracing"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
bytes = "1"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "io-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 1

[workspace]
