[package]
name = "bench-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
giong = { path = "../.." }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }
smol = "2"
async-channel = "2"
futures-channel = "0.3"
futures-lite = "2"

# The io_uring runtimes, and getrusage.
[target.'cfg(target_os = "linux")'.dependencies]
monoio = { version = "0.2", features = ["sync"] }
local-sync = "0.1"
glommio = "0.9"
compio = { version = "0.19", features = ["runtime", "time", "io-uring", "net", "io"] }
libc = "0.2"

# The process's CPU time.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = "line-tables-only"

[workspace]
