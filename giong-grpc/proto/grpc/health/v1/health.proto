// The gRPC health checking protocol
// (github.com/grpc/grpc/blob/master/doc/health-checking.md): the messages
// and the service, with the names and numbers of grpc-proto's
// grpc/health/v1/health.proto.

syntax = "proto3";

package grpc.health.v1;

message HealthCheckRequest {
  // The service asked about; empty for the server as a whole.
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    // Only in answers to Watch.
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}

message HealthListRequest {}

message HealthListResponse {
  // The status of every service the server knows, by name.
  map<string, HealthCheckResponse> statuses = 1;
}

service Health {
  // The status of one service now. NOT_FOUND for a service the server
  // does not know.
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

  // The status of every service now.
  rpc List(HealthListRequest) returns (HealthListResponse);

  // The status of one service now, and again each time it changes, until
  // the client ends the call.
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
