[package]
name = "giong-http"
version = "1.4.2"
edition = "2021"
rust-version = "1.80"
description = "A small, strict HTTP/1.1 and HTTP/2 server and client for the giong thread-per-core runtime"
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = ["fuzz/"]
repository = "https://github.com/giong-run/Giong"
documentation = "https://docs.rs/giong-http"
keywords = ["http", "server", "client", "io-uring", "thread-per-core"]
categories = ["web-programming::http-server", "web-programming::http-client", "network-programming"]

[features]
# HTTPS through `Server::serve_tls`, using giong-tls (rustls).
tls = ["dep:giong-tls"]
# The HTTP/1.1 and HTTP/2 client in `giong_http::client`, with HTTPS through giong-tls
# and gzip/deflate bodies decoded with miniz_oxide.
client = ["dep:giong-tls", "dep:libc", "dep:miniz_oxide"]
# HTTP/3 (RFC 9114) over giong-quic, through `Server::serve_h3`. Being built
# for 1.3: may change until it is stabilised.
unstable-http3 = ["dep:giong-quic", "giong/unstable-udp-offload"]

[dependencies]
giong = { path = "..", version = "1.4.2" }
giong-tls = { path = "../giong-tls", version = "1.4.2", optional = true }
giong-quic = { path = "../giong-quic", version = "1.4.2", optional = true }
libc = { version = "0.2.172", optional = true }
miniz_oxide = { version = "0.9", optional = true }

# The server's accept loop peeks at sockets before closing idle connections.
# Already a dependency of giong.
[target.'cfg(unix)'.dependencies]
libc = "0.2.172"

[dev-dependencies]
miniz_oxide = "0.9"
rcgen = "0.13"
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std", "tls12"] }
# A TCP socket that is bound but does not listen. Already a dependency of giong.
socket2 = "0.6"
# An HTTP/3 client that is not giong's own, on Tokio in a thread of its own,
# against `Server::serve_h3`.
bytes = "1.9"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.2"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1.38", features = ["rt", "net", "time", "macros"] }

[[test]]
name = "tls"
required-features = ["tls"]

[[test]]
name = "client"
required-features = ["client", "tls"]

[[test]]
name = "client_h2"
required-features = ["client", "tls"]

[[test]]
name = "tracing"
required-features = ["client"]

[[test]]
name = "h3"
required-features = ["unstable-http3"]

[[example]]
name = "h2"
required-features = ["tls"]

[[example]]
name = "h3"
required-features = ["unstable-http3"]

[lints.rust]
# Set by `cargo fuzz` (see fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[package.metadata.docs.rs]
all-features = true
