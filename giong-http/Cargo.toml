[package]
name = "giong-http"
version = "0.2.1"
edition = "2021"
rust-version = "1.80"
description = "A small, strict HTTP/1.1 server and client for the giong thread-per-core runtime"
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = ["fuzz/"]
repository = "https://github.com/giong-run/Giong"
documentation = "https://docs.rs/giong-http"
keywords = ["http", "server", "client", "io-uring", "thread-per-core"]
categories = ["web-programming::http-server", "web-programming::http-client", "network-programming"]

[features]
# HTTPS through `Server::serve_tls`, using giong-tls (rustls).
tls = ["dep:giong-tls"]
# The HTTP/1.1 client in `giong_http::client`, with HTTPS through giong-tls
# and gzip/deflate bodies decoded with miniz_oxide.
client = ["dep:giong-tls", "dep:libc", "dep:miniz_oxide"]

[dependencies]
giong = { path = "..", version = "0.2.1" }
giong-tls = { path = "../giong-tls", version = "0.2.1", optional = true }
libc = { version = "0.2", optional = true }
miniz_oxide = { version = "0.9", optional = true }

[dev-dependencies]
miniz_oxide = "0.9"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[[test]]
name = "tls"
required-features = ["tls"]

[[test]]
name = "client"
required-features = ["client", "tls"]

[lints.rust]
# Set by `cargo fuzz` (see fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[package.metadata.docs.rs]
all-features = true
