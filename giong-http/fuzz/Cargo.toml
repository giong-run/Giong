[package]
name = "giong-http-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
giong = { path = "../.." }
giong-http = { path = "..", features = ["client"] }

# Its own workspace, like the benchmark crates: needs nightly and cargo-fuzz.
[workspace]

[[bin]]
name = "head"
path = "fuzz_targets/head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunked"
path = "fuzz_targets/chunked.rs"
test = false
doc = false
bench = false

[[bin]]
name = "connection"
path = "fuzz_targets/connection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_head"
path = "fuzz_targets/response_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_body"
path = "fuzz_targets/response_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "url"
path = "fuzz_targets/url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inflate"
path = "fuzz_targets/inflate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hpack"
path = "fuzz_targets/hpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h2"
path = "fuzz_targets/h2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h2_client"
path = "fuzz_targets/h2_client.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
