[package]
name = "giong"
version = "0.2.1"
edition = "2021"
rust-version = "1.80"
description = "Gióng — a thread-per-core async runtime for Linux built directly on io_uring"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/giong-run/Giong"
documentation = "https://docs.rs/giong"
keywords = ["async", "runtime", "io-uring", "thread-per-core", "network"]
categories = ["asynchronous", "network-programming"]
exclude = ["bench/", "giong-http/", "giong-tls/", "giong-postgres/", ".github/", "scripts/", "assets/", "site/", "docs/"]

[workspace]
members = [".", "giong-http", "giong-tls", "giong-postgres"]
exclude = ["bench"]

[dependencies]
io-uring = "0.7"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }

[lints.rust]
# Set by scripts/check.sh for ThreadSanitizer builds (see Driver::close_fd).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(giong_tsan)'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"

[dev-dependencies]
libc = "0.2"
