[package]
name = "giong-grpc-build"
version = "1.3.0"
edition = "2021"
rust-version = "1.80"
description = "Generates giong-proto views and gRPC service descriptions from .proto files at build time, with no protoc to install"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/giong-run/Giong"
documentation = "https://docs.rs/giong-grpc-build"
keywords = ["protobuf", "grpc", "codegen", "build"]
categories = ["development-tools::build-utils", "encoding"]

[dependencies]
# Pure-Rust .proto parser: no protoc binary. 0.8 keeps the minimum Rust
# version at 1.80 (0.10 needs 1.85).
protox = "0.8"
prost-types = "0.13"
# Encodes the descriptors the generated code carries for reflection.
prost = "0.13"
