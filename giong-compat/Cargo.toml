[package]
name = "giong-compat"
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
description = "Tokio and futures-io I/O traits for giong's streams, so transport-generic protocol crates run on giong"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/giong-run/Giong"
documentation = "https://docs.rs/giong-compat"
keywords = ["async", "tokio", "futures", "io-uring", "compat"]
categories = ["asynchronous", "network-programming"]

[features]
default = ["tokio", "futures-io"]
# `tokio::io::{AsyncRead, AsyncWrite, AsyncBufRead}`. Only the traits: no
# Tokio runtime, reactor or timer is pulled in.
tokio = ["dep:tokio"]
# `futures_io::{AsyncRead, AsyncWrite, AsyncBufRead}`.
futures-io = ["dep:futures-io"]
# `Compat<giong_tls::TlsStream>`.
tls = ["dep:giong-tls"]

[dependencies]
giong = { path = "..", version = "0.4.0" }
giong-tls = { path = "../giong-tls", version = "0.4.0", optional = true }
# The trait definitions only; the crate's default features (the runtime) stay
# off.
tokio = { version = "1.13", default-features = false, optional = true }
futures-io = { version = "0.3.31", optional = true }

[dev-dependencies]
giong-http = { path = "../giong-http", version = "0.4.0", features = ["client"] }
giong-tls = { path = "../giong-tls", version = "0.4.0" }
# Real crates that are generic over the transport, driven through `Compat`.
# None of them gets a Tokio runtime: the tests run on giong only.
bytes = "1.9"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "io", "sink"] }
h2 = "0.4.2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
libc = "0.2.172"
rcgen = "0.13"
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.13", default-features = false, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7.1", default-features = false, features = ["codec"] }

[package.metadata.docs.rs]
all-features = true
