[package]
name = "giong-tls"
version = "1.5.3"
edition = "2021"
rust-version = "1.80"
description = "TLS for the giong thread-per-core runtime, built on rustls"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/giong-run/Giong"
documentation = "https://docs.rs/giong-tls"
keywords = ["tls", "rustls", "io-uring", "thread-per-core", "async"]
categories = ["network-programming", "cryptography"]

[features]
# `TlsConnector::with_webpki_roots`: Mozilla's root certificates compiled in,
# for machines without a CA bundle (container images built `FROM scratch`).
webpki-roots = ["dep:webpki-roots"]
# `TlsAcceptor::from_rustls`, `TlsConnector::from_rustls`,
# `KtlsSupport::supports` and the `rustls` re-export: the rustls types
# themselves, for what the rest of the API does not cover. Outside the semver
# promise: these follow the rustls version giong-tls uses, which a minor
# release may raise (see docs/STABILITY.md).
unstable-rustls = []
# Post-quantum key exchange: aws-lc-rs as the cryptography instead of *ring*,
# and X25519MLKEM768 offered first, on the server and the client. Building
# aws-lc-rs needs a C compiler and CMake.
post-quantum = ["rustls/aws_lc_rs", "rustls/prefer-post-quantum"]

[dependencies]
giong = { path = "..", version = "1.5.3" }
libc = "0.2.172"
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std", "tls12"] }
# `CertificateDer`, the one type from outside the crate in the stable API:
# rustls-pki-types stays at 1.x whatever rustls does.
rustls-pki-types = { version = "1.12", features = ["std"] }
webpki-roots = { version = "1", optional = true }
# Which of several certificates is valid for the name a client asks for.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }

# Sends that do not wait (`send`) and the trusted roots in the system's
# certificate stores. Already in the tree through giong.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
# The tests build rustls configurations of their own.
giong-tls = { path = ".", features = ["unstable-rustls"] }
rcgen = "0.13"

# The soak test reads the process's handle count and working set.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lints.rust]
# Set by `cargo fuzz` (see fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[package.metadata.docs.rs]
all-features = true
