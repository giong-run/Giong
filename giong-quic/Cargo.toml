[package]
name = "giong-quic"
version = "0.0.0"
edition = "2021"
# The same minimum as giong. quinn-proto (the fallback engine) needs Rust 1.85
# from 0.11.15 on, so the requirement starts at 0.11.14 (which needs 1.74) and
# the lockfile CI uses for the 1.80 check stays there; a newer toolchain
# resolves to the newest 0.11.
rust-version = "1.80"
description = "QUIC for the giong thread-per-core runtime (prototype, not published)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/giong-run/Giong"
publish = false

[features]
# The engine behind the public API. Today only quinn-proto is complete; the
# native engine (src/native) grows behind the same API and replaces it once it
# passes the interop runner's core cases (plan for 1.1-1.4, section 11).
default = []

[dependencies]
giong = { path = "..", features = ["unstable-udp-offload"] }
quinn-proto = { version = "0.11.14", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std"] }
bytes = "1"

[dev-dependencies]
rcgen = "0.13"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
