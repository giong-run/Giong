[package]
name = "giong-quic"
version = "1.5.6"
edition = "2021"
# Above giong's 1.80: quinn-proto (the engine) fixes a remote memory
# exhaustion in 0.11.15 (GHSA-4w2j-m93h-cj5j), and from that version on it
# needs Rust 1.85. Only giong-quic and giong-http's `unstable-http3` feature
# need 1.85; the `msrv` CI job checks both minimums.
rust-version = "1.85"
description = "QUIC for the giong thread-per-core runtime: endpoints, streams and 0-RTT on rustls"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/giong-run/Giong"
documentation = "https://docs.rs/giong-quic"
keywords = ["quic", "http3", "udp", "thread-per-core", "async"]
categories = ["network-programming", "asynchronous"]

[features]
# The engine behind the public API. Today only quinn-proto is complete; the
# native engine (src/native) grows behind the same API and replaces it once it
# passes the interop runner's core cases (plan for 1.1-1.4, section 11).
default = []

[dependencies]
giong = { path = "..", version = "1.5.6", features = ["unstable-udp-offload"] }
quinn-proto = { version = "0.11.15", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23.33", default-features = false, features = ["ring", "std"] }
bytes = "1"
# The stateless reset key (HMAC-SHA256), as quinn-proto takes it. Already in
# the tree through rustls.
ring = { version = "0.17", default-features = false }

[dev-dependencies]
rcgen = "0.13"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
