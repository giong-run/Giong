[package]
name = "giong-mcp"
version = "1.5.6"
edition = "2021"
rust-version = "1.80"
description = "An MCP server that lets AI agents look inside a running giong service: workers, tasks, pools, profiles"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/giong-run/Giong"
documentation = "https://docs.rs/giong-mcp"
keywords = ["mcp", "observability", "diagnostics", "agent", "thread-per-core"]
categories = ["development-tools::debugging", "asynchronous", "network-programming"]
exclude = ["fuzz/"]

[dependencies]
giong = { path = "..", version = "1.5.6" }
giong-http = { path = "../giong-http", version = "1.5.6" }
# JSON-RPC messages. Already in the workspace through giong-web's `serde`
# feature.
serde_json = "1"
# The `routes` tool: the routes of the giong-web apps the workers serve.
giong-web = { path = "../giong-web", version = "1.5.6", optional = true }

[features]
# The `routes` tool, which lists the routes of the giong-web apps the
# service's workers serve (`giong_web::RouteList::live`).
web = ["dep:giong-web"]

# `proc_pidinfo`, for the process figures that Linux has in /proc.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.172"

# The process figures (memory, handles, threads, start time) and the
# reparse tag that tells a Unix socket file from other files.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
socket2 = "0.6"

[dev-dependencies]
giong-http = { path = "../giong-http", version = "1.5.6", features = ["client"] }
giong-web = { path = "../giong-web", version = "1.5.6" }

# Unix sockets made outside giong-mcp in the tests: Windows' standard
# library has none.
[target.'cfg(windows)'.dev-dependencies]
socket2 = "0.6"

[lints.rust]
# `fuzzing` is set by `cargo fuzz` (see fuzz/), `giong_tsan` by the
# ThreadSanitizer builds in `scripts/check.sh`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(giong_tsan)'] }
