[package]
name = "giong-mcp"
version = "1.2.0"
edition = "2021"
rust-version = "1.80"
description = "An MCP server that lets AI agents look inside a running giong service: workers, tasks, pools, profiles"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/giong-run/Giong"
documentation = "https://docs.rs/giong-mcp"
keywords = ["mcp", "observability", "diagnostics", "agent", "thread-per-core"]
categories = ["development-tools::debugging", "asynchronous", "network-programming"]
exclude = ["fuzz/"]

[dependencies]
giong = { path = "..", version = "1.2.0" }
giong-http = { path = "../giong-http", version = "1.2.0" }
# JSON-RPC messages. Already in the workspace through giong-web's `serde`
# feature.
serde_json = "1"

# `proc_pidinfo`, for the process figures that Linux has in /proc.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.172"

[dev-dependencies]
giong-http = { path = "../giong-http", version = "1.2.0", features = ["client"] }

[lints.rust]
# `fuzzing` is set by `cargo fuzz` (see fuzz/), `giong_tsan` by the
# ThreadSanitizer builds in `scripts/check.sh`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(giong_tsan)'] }
