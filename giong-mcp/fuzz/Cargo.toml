[package]
name = "giong-mcp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
giong-mcp = { path = ".." }

# Its own workspace, like the benchmark crates: needs nightly and cargo-fuzz.
[workspace]

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
